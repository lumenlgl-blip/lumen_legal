<!DOCTYPE html>
<html>
<head>
    <title>Consulta de Pagos - Lumen Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .client-card { border-left: 4px solid #0d6efd; background: #f8f9fa; transition: all 0.3s ease; cursor: pointer; }
        .client-card:hover { background: #e9ecef; transform: translateX(5px); }
        .contract-card { border-left: 4px solid #ffc107; background: #fff; }
        .modal-pdf { width: 100%; height: 80vh; border: none; }
        .badge-liquidado { background: #198754; }
        .badge-pendiente { background: #dc3545; }
        .btn-menu { position: fixed; top: 20px; left: 20px; z-index: 1000; }
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spinner-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>
<body class="bg-light">

<a href="/" class="btn btn-outline-dark btn-menu">← Menú Principal</a>

<div class="container mt-5">
    <h1 class="text-center mb-4">📊 Consulta de Pagos</h1>
    
    <!-- Buscador -->
    <div class="card p-4 shadow mb-4">
        <h5 class="mb-3"><strong>Buscar Cliente</strong></h5>
        <div class="row">
            <div class="col-md-8 mb-2">
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Buscar por nombre, CURP, teléfono, folio o expediente interno..." autocomplete="off">
            </div>
            <div class="col-md-4">
                <button id="searchBtn" class="btn btn-primary btn-lg w-100">🔍 Buscar</button>
            </div>
        </div>
    </div>
    
    <!-- Resultados -->
    <div id="resultsContainer"></div>
    
    <!-- Detalle del cliente -->
    <div id="clientDetailContainer" style="display:none;" class="mt-4">
        <div class="card p-4 shadow">
            <h4 id="clientNameDisplay" class="text-primary"></h4>
            <p id="clientInfoDisplay" class="text-muted"></p>
            <hr>
            <div id="contractsContainer"></div>
        </div>
    </div>
</div>

<!-- Modal para ver comprobante -->
<div class="modal fade" id="receiptModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Comprobante de Pago</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <iframe id="pdfViewer" src="" class="modal-pdf"></iframe>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <a id="downloadPdfBtn" href="#" download class="btn btn-primary">⬇️ Descargar</a>
            </div>
        </div>
    </div>
</div>

<!-- Modal de notificaciones -->
<div class="modal fade" id="notificationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" id="notificationHeader">
                <h5 class="modal-title" id="notificationTitle">Notificación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="notificationBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- Loading overlay -->
<div id="loadingOverlay" class="spinner-overlay" style="display:none;">
    <div class="spinner-box">
        <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <h5 class="mb-0">Cargando información...</h5>
        <p class="text-muted small">Por favor espera.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function showNotification(title, bodyHTML, type = 'info') {
    const modal = new bootstrap.Modal(document.getElementById('notificationModal'));
    const header = document.getElementById('notificationHeader');
    const titleEl = document.getElementById('notificationTitle');
    const bodyEl = document.getElementById('notificationBody');
    header.className = 'modal-header';
    if (type === 'success') { header.classList.add('bg-success', 'text-white'); titleEl.textContent = '✅ ' + title; }
    else if (type === 'error') { header.classList.add('bg-danger', 'text-white'); titleEl.textContent = '❌ ' + title; }
    else if (type === 'warning') { header.classList.add('bg-warning', 'text-dark'); titleEl.textContent = '⚠️ ' + title; }
    else { header.classList.add('bg-primary', 'text-white'); titleEl.textContent = 'ℹ️ ' + title; }
    bodyEl.innerHTML = bodyHTML;
    modal.show();
}

function showLoading() {
    document.getElementById('loadingOverlay').style.display = 'flex';
}

function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
}

// Buscar con Enter
document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('searchBtn').click();
    }
});

document.getElementById('searchBtn').addEventListener('click', async () => {
    const searchTerm = document.getElementById('searchInput').value.trim().toUpperCase();
    if (!searchTerm) {
        showNotification('Búsqueda vacía', '<p>Por favor ingresa un término de búsqueda.</p>', 'warning');
        return;
    }
    
    // Limpiar búsqueda anterior y detalle del cliente
    document.getElementById('resultsContainer').innerHTML = '';
    document.getElementById('clientDetailContainer').style.display = 'none';
    document.getElementById('contractsContainer').innerHTML = '';
    
    showLoading();
    
    try {
        const formData = new FormData();
        formData.append('search_term', searchTerm);
        
        // Usar endpoint de consulta general (todos los clientes)
        const response = await fetch('/api/payments/search-client-all', {
            method: 'POST',
            body: formData
        });
        
        hideLoading();
        
        if (!response.ok) {
            const error = await response.json();
            showNotification('Sin resultados', `<p>${error.detail || 'No se encontraron clientes'}</p>`, 'warning');
            document.getElementById('resultsContainer').innerHTML = '';
            return;
        }
        
        const clients = await response.json();
        const container = document.getElementById('resultsContainer');
        
        if (clients.length === 0) {
            container.innerHTML = '<div class="alert alert-warning text-center"><strong>No se encontraron clientes.</strong></div>';
            return;
        }
        
        container.innerHTML = '<h5 class="mb-3"><strong>Clientes encontrados:</strong></h5>';
        
        clients.forEach(client => {
            const card = document.createElement('div');
            card.className = 'client-card p-3 mb-2 rounded';
            card.innerHTML = `
                <div class="row align-items-center">
                    <div class="col-md-3"><strong>${client.nombre_completo}</strong></div>
                    <div class="col-md-2"><span class="badge bg-secondary">${client.folio_registro}</span></div>
                    <div class="col-md-2"><span class="badge bg-primary">Exp. ${client.expediente_interno}</span></div>
                    <div class="col-md-3"><small>${client.curp}</small></div>
                    <div class="col-md-2"><button class="btn btn-sm btn-success view-client" data-id="${client.id}">Ver detalles</button></div>
                </div>
                <div class="mt-2">
                    <small class="text-muted">Contratos: ${client.contratos_count}</small><br>
                    <small class="text-success"><strong>Total pagado:</strong> $${client.total_pagado.toLocaleString()}</small><br>
                    <small class="text-danger"><strong>Total deuda:</strong> $${client.deuda_total.toLocaleString()}</small>
                </div>
            `;
            container.appendChild(card);
        });
        
        document.querySelectorAll('.view-client').forEach(btn => {
            btn.addEventListener('click', async () => {
                const clientId = btn.dataset.id;
                await loadClientDetail(clientId);
            });
        });
        
    } catch (error) {
        hideLoading();
        showNotification('Error de conexión', `<p>${error.message}</p>`, 'error');
    }
});

async function loadClientDetail(clientId) {
    showLoading();
    
    try {
        const response = await fetch(`/api/payments/client/${clientId}`);
        const client = await response.json();
        
        hideLoading();
        
        document.getElementById('clientDetailContainer').style.display = 'block';
        document.getElementById('clientNameDisplay').textContent = client.nombre_completo;
        document.getElementById('clientInfoDisplay').textContent = 
            `CURP: ${client.curp} | Teléfono: ${client.telefono} | Exp. Interno: ${client.expediente_interno} | Folio: ${client.folio_registro}`;
        
        const container = document.getElementById('contractsContainer');
        container.innerHTML = '';
        
        if (client.contratos.length === 0) {
            container.innerHTML = '<div class="alert alert-warning"><strong>Este cliente no tiene contratos registrados.</strong></div>';
            return;
        }
        
        client.contratos.forEach(contract => {
            const card = document.createElement('div');
            card.className = 'contract-card p-3 mb-3 shadow-sm';
            card.innerHTML = `
                <div class="row">
                    <div class="col-md-8">
                        <h6><i class="bi bi-file-earmark-text"></i> ${contract.servicio}</h6>
                        <p><strong>Total:</strong> $${contract.total.toLocaleString()} | 
                           <strong>Pagado:</strong> $${contract.pagado.toLocaleString()} | 
                           <strong>Saldo:</strong> $${contract.saldo.toLocaleString()}</p>
                        <span class="badge ${contract.status === 'liquidado' ? 'badge-liquidado' : 'badge-pendiente'}">
                            ${contract.status.toUpperCase()}
                        </span>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-sm btn-info toggle-payments" data-contract="${contract.id}">
                            <i class="bi bi-eye"></i> Ver pagos
                        </button>
                    </div>
                </div>
                <div id="payments-${contract.id}" style="display:none;" class="mt-2">
                    <hr>
                    <h6>Pagos registrados</h6>
                    ${contract.pagos.length === 0 ? '<p class="text-muted">No hay pagos registrados.</p>' : ''}
                    <div class="row">
                        ${contract.pagos.map(p => `
                            <div class="col-md-6 col-lg-4 mb-2">
                                <div class="card p-2">
                                    <small><strong>$${p.monto.toLocaleString()}</strong> - ${p.metodo}</small><br>
                                    <small class="text-muted">${p.fecha}</small><br>
                                    <small class="text-muted">Recibió: ${p.recibio}</small>
                                    ${p.comprobante ? `
                                        <button class="btn btn-sm btn-outline-primary view-receipt mt-1" 
                                            data-url="${p.comprobante}" 
                                            data-filename="comprobante_${p.id}.pdf">
                                            <i class="bi bi-file-pdf"></i> Ver comprobante
                                        </button>
                                    ` : '<span class="text-muted">Sin comprobante</span>'}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
        
        // Mostrar/ocultar pagos
        document.querySelectorAll('.toggle-payments').forEach(btn => {
            btn.addEventListener('click', function() {
                const contractId = this.dataset.contract;
                const el = document.getElementById(`payments-${contractId}`);
                if (el.style.display === 'none') {
                    el.style.display = 'block';
                    this.innerHTML = '<i class="bi bi-eye-slash"></i> Ocultar pagos';
                } else {
                    el.style.display = 'none';
                    this.innerHTML = '<i class="bi bi-eye"></i> Ver pagos';
                }
            });
        });
        
        // Ver comprobante
        document.querySelectorAll('.view-receipt').forEach(btn => {
            btn.addEventListener('click', function() {
                const url = this.dataset.url;
                const filename = this.dataset.filename;
                document.getElementById('pdfViewer').src = url;
                document.getElementById('downloadPdfBtn').href = url;
                document.getElementById('downloadPdfBtn').download = filename;
                new bootstrap.Modal(document.getElementById('receiptModal')).show();
            });
        });
        
        // Agregar resumen general al final
        const totalContainer = document.createElement('div');
        totalContainer.className = 'alert alert-info mt-3';
        totalContainer.innerHTML = `
            <div class="row text-center">
                <div class="col-md-6">
                    <h5 class="text-success mb-0"><strong>💰 Total Pagado:</strong></h5>
                    <h4 class="text-success">$${client.total_pagado_general.toLocaleString()}</h4>
                </div>
                <div class="col-md-6">
                    <h5 class="text-danger mb-0"><strong>📋 Total Deuda:</strong></h5>
                    <h4 class="text-danger">$${client.total_deuda_general.toLocaleString()}</h4>
                </div>
            </div>
        `;
        container.appendChild(totalContainer);
        
        document.getElementById('clientDetailContainer').scrollIntoView({ behavior: 'smooth' });
        
    } catch (error) {
        hideLoading();
        showNotification('Error', `<p>Error al cargar detalles: ${error.message}</p>`, 'error');
    }
}

</script>
</body>
</html>
