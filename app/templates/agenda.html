<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1e33" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a1523" media="(prefers-color-scheme: dark)">
    <title>Agenda Judicial · Lumen Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           VARIABLES DE TEMA
           ============================================================ */
        :root {
            --bg-primary: #f4f7fc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f8fafc;
            --surface-glass: rgba(255,255,255,0.8);
            --surface-glass-strong: rgba(255,255,255,0.92);
            --border-subtle: rgba(255,255,255,0.5);
            --border-soft: #e9edf4;
            --border-strong: #dbe4ef;
            --text-primary: #0b1e33;
            --text-secondary: #4a5b6e;
            --text-muted: #64748b;
            --text-light: #8a9bb0;
            --accent-primary: #2a6df4;
            --accent-primary-hover: #1a5ad4;
            --accent-light: #7aa9ff;
            --accent-dark: #0b1e33;
            --accent-dark-hover: #1a3b6b;
            --success: #1a8b5c;
            --success-hover: #0e6b46;
            --success-soft: #d1fae5;
            --warning: #f5b342;
            --warning-hover: #e6a030;
            --warning-soft: #fdf3e0;
            --danger: #dc3545;
            --danger-hover: #b02a37;
            --danger-soft: #fee9e7;
            --info: #1f6f9e;
            --info-soft: #e3effa;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 48px -12px rgba(0,20,40,0.12);
            --shadow-xl: 0 40px 80px -20px rgba(0,0,0,0.2);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 28px;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0a1523;
            --bg-secondary: #111d2e;
            --bg-tertiary: #16243a;
            --surface-glass: rgba(22,36,58,0.75);
            --surface-glass-strong: rgba(22,36,58,0.92);
            --border-subtle: rgba(255,255,255,0.08);
            --border-soft: #223147;
            --border-strong: #2d3f5a;
            --text-primary: #e8eef7;
            --text-secondary: #b8c5d6;
            --text-muted: #8a9bb0;
            --text-light: #6b7b8f;
            --accent-primary: #5b93ff;
            --accent-primary-hover: #7aa9ff;
            --accent-light: #a8c5ff;
            --accent-dark: #5b93ff;
            --accent-dark-hover: #7aa9ff;
            --success: #34d399;
            --success-hover: #10b981;
            --success-soft: rgba(52,211,153,0.15);
            --warning: #fbbf24;
            --warning-hover: #f59e0b;
            --warning-soft: rgba(251,191,36,0.15);
            --danger: #f87171;
            --danger-hover: #ef4444;
            --danger-soft: rgba(248,113,113,0.15);
            --info: #60a5fa;
            --info-soft: rgba(96,165,250,0.15);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 20px 48px -12px rgba(0,0,0,0.5);
            --shadow-xl: 0 40px 80px -20px rgba(0,0,0,0.6);
        }

        * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--bg-primary);
            background-image:
                radial-gradient(at 0% 0%, rgba(42,109,244,0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(26,139,92,0.06) 0px, transparent 50%);
            padding: 20px 0 40px 0;
            min-height: 100vh;
            color: var(--text-primary);
            transition: background-color var(--transition-normal), color var(--transition-normal);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================================
           THEME TOGGLE
           ============================================================ */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1050;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--surface-glass-strong);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: all var(--transition-normal);
        }
        .theme-toggle:hover {
            transform: translateY(-2px) rotate(15deg);
            box-shadow: var(--shadow-lg);
            color: var(--accent-primary);
        }

        /* ============================================================
           BOTÓN MENÚ
           ============================================================ */
        .btn-menu {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1050;
            background: var(--surface-glass-strong);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: 60px;
            padding: 12px 24px;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-md);
            transition: all var(--transition-normal);
        }
        .btn-menu:hover {
            background: var(--bg-secondary);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
            color: var(--accent-primary);
        }

        /* ============================================================
           TÍTULO
           ============================================================ */
        .page-title {
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .page-title i {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ============================================================
           CARDS MODERN
           ============================================================ */
        .card-modern {
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            transition: box-shadow var(--transition-normal);
            animation: fadeInUp 0.4s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-modern:hover { box-shadow: var(--shadow-lg); }

        /* ============================================================
           CALENDAR HEADER
           ============================================================ */
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 12px;
        }
        .calendar-header h3 {
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin: 0;
        }

        .btn-circle {
            width: 44px;
            height: 44px;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-soft);
            color: var(--text-primary);
            transition: all var(--transition-normal);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .btn-circle:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* ============================================================
           FILTRO DE USUARIO
           ============================================================ */
        #userFilterContainer .form-select {
            border-radius: 60px;
            padding: 10px 20px;
            font-size: 0.88rem;
            background: var(--bg-secondary);
            border: 1.5px solid var(--border-soft);
            color: var(--text-primary);
            min-height: 44px;
        }
        #userFilterContainer .form-select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(42,109,244,0.12);
        }
        #applyFilterBtn {
            border-radius: 60px;
            padding: 10px 20px;
            font-size: 0.88rem;
            font-weight: 700;
            min-height: 44px;
            background: var(--accent-dark);
            border: none;
            transition: all var(--transition-normal);
        }
        #applyFilterBtn:hover {
            background: var(--accent-dark-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -8px rgba(42,109,244,0.4);
        }

        /* ============================================================
           CALENDARIO
           ============================================================ */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .weekday-label {
            font-weight: 700;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            padding: 6px 0;
            text-align: center;
        }
        .weekday-label.text-danger { color: var(--danger); }

        .calendar-day {
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: 10px 8px 8px 12px;
            min-height: 100px;
            border: 1.5px solid var(--border-soft);
            transition: all var(--transition-normal);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .calendar-day:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -12px rgba(42,109,244,0.25);
        }
        .calendar-day.today {
            border: 2px solid var(--accent-primary);
            background: linear-gradient(135deg, rgba(42,109,244,0.06), rgba(42,109,244,0.12));
            box-shadow: 0 4px 16px rgba(42,109,244,0.15);
        }
        .calendar-day.has-events {
            background: linear-gradient(135deg, rgba(245,179,66,0.06), rgba(245,179,66,0.02));
        }
        [data-theme="dark"] .calendar-day.has-events {
            background: linear-gradient(135deg, rgba(251,191,36,0.08), rgba(251,191,36,0.02));
        }
        .calendar-day.other-month {
            background: var(--bg-tertiary);
            color: var(--text-light);
            opacity: 0.5;
            cursor: default;
        }
        .calendar-day.other-month:hover {
            transform: none;
            border-color: var(--border-soft);
            box-shadow: none;
        }
        .calendar-day.weekend {
            background: rgba(220,53,69,0.04);
        }
        [data-theme="dark"] .calendar-day.weekend {
            background: rgba(248,113,113,0.06);
        }

        .day-number {
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .calendar-day.today .day-number { color: var(--accent-primary); }
        .calendar-day.weekend .day-number { color: var(--danger); }

        /* ============================================================
           EVENT BADGES
           ============================================================ */
        .event-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 40px;
            margin: 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: all var(--transition-fast);
            border: none;
            letter-spacing: 0.01em;
            background: rgba(42,109,244,0.08);
            color: var(--accent-primary);
            max-width: 100%;
        }
        .event-badge:hover {
            transform: translateX(2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }
        .event-audiencia { background: var(--danger-soft); color: var(--danger); }
        .event-plazos { background: var(--warning-soft); color: #9b5e00; }
        [data-theme="dark"] .event-plazos { color: var(--warning); }
        .event-junta { background: var(--info-soft); color: var(--info); }
        .event-otro { background: var(--bg-tertiary); color: var(--text-secondary); }
        .event-completed {
            background: var(--success-soft) !important;
            color: var(--success) !important;
            border-left: 3px solid var(--success) !important;
            text-decoration: line-through;
            opacity: 0.85;
        }

        /* ============================================================
           SIDE PANEL
           ============================================================ */
        .side-panel-title {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            border-bottom: 2px solid var(--border-soft);
            padding-bottom: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .side-panel-title i { color: var(--accent-primary); }

        .day-event-item {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 10px;
            border-left: 5px solid var(--accent-primary);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-normal);
            animation: fadeInUp 0.3s ease-out backwards;
        }
        .day-event-item:hover {
            background: var(--bg-tertiary);
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
        }
        .day-event-item .ev-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
        }
        .day-event-item .ev-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 6px;
            align-items: center;
        }

        .badge-type {
            font-weight: 700;
            font-size: 0.62rem;
            padding: 3px 10px;
            border-radius: 40px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            background: rgba(42,109,244,0.08);
            color: var(--accent-primary);
        }
        .badge-type.audiencia { background: var(--danger-soft); color: var(--danger); }
        .badge-type.plazos { background: var(--warning-soft); color: #9b5e00; }
        [data-theme="dark"] .badge-type.plazos { color: var(--warning); }
        .badge-type.junta { background: var(--info-soft); color: var(--info); }
        .badge-type.otro { background: var(--bg-tertiary); color: var(--text-secondary); }

        .upcoming-event-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid var(--border-soft);
            transition: all var(--transition-normal);
            animation: fadeInUp 0.3s ease-out backwards;
        }
        .upcoming-event-card:hover {
            background: var(--bg-tertiary);
            transform: translateX(4px);
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-sm);
        }

        /* ============================================================
           MODALES MODERNOS
           ============================================================ */
        .modal-modern .modal-content {
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            background: var(--surface-glass-strong);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text-primary);
        }
        .modal-modern .modal-header {
            border-bottom: none;
            padding: 22px 28px 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-modern .modal-header .modal-title {
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-modern .modal-body { padding: 18px 28px 24px; }
        .modal-modern .modal-footer {
            border-top: 1px solid var(--border-soft);
            padding: 16px 28px 22px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal.fade .modal-dialog {
            transform: scale(0.92) translateY(20px);
            opacity: 0;
            transition: transform 0.35s var(--transition-bounce), opacity 0.3s ease;
        }
        .modal.show .modal-dialog {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        [data-theme="dark"] .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }
        .btn-close-white { filter: invert(1) grayscale(100%) brightness(200%); }
        [data-theme="dark"] .btn-close-white { filter: none; }

        .modal-header.header-success { background: linear-gradient(135deg, var(--success), var(--success-hover)); }
        .modal-header.header-error { background: linear-gradient(135deg, var(--danger), var(--danger-hover)); }
        .modal-header.header-warning { background: linear-gradient(135deg, var(--warning), var(--warning-hover)); }
        .modal-header.header-info { background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-hover)); }
        .modal-header.header-dark { background: linear-gradient(135deg, #1a3b6b, #0b1e33); }
        .modal-header.header-success .modal-title,
        .modal-header.header-error .modal-title,
        .modal-header.header-warning .modal-title,
        .modal-header.header-info .modal-title,
        .modal-header.header-dark .modal-title { color: white; }

        .notification-icon {
            font-size: 3.5rem;
            text-align: center;
            display: block;
            margin: 8px 0 16px;
            animation: popIn 0.5s var(--transition-bounce);
        }
        .notification-icon.success { color: var(--success); }
        .notification-icon.error { color: var(--danger); }
        .notification-icon.warning { color: var(--warning); }
        .notification-icon.info { color: var(--accent-primary); }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* ============================================================
           FORMULARIOS
           ============================================================ */
        .form-control, .form-select {
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border-soft);
            padding: 14px 18px;
            font-size: 0.95rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            min-height: 52px;
        }
        .form-control::placeholder { color: var(--text-light); }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(42,109,244,0.12);
            background: var(--bg-secondary);
            color: var(--text-primary);
            outline: none;
        }
        .form-label {
            font-weight: 700;
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-lg-modern {
            border-radius: 60px;
            padding: 12px 28px;
            font-weight: 700;
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition-normal);
        }
        .btn-lg-modern:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* ============================================================
           SPINNER OVERLAY
           ============================================================ */
        .spinner-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11,30,51,0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .spinner-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .spinner-box {
            background: var(--bg-secondary);
            padding: 40px 52px;
            border-radius: var(--radius-xl);
            text-align: center;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-subtle);
            animation: popIn 0.4s var(--transition-bounce);
            max-width: 90vw;
        }
        .spinner-box .spinner-border {
            width: 3rem;
            height: 3rem;
            color: var(--accent-primary);
            border-width: 3px;
        }
        .spinner-box h5 {
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 16px;
        }
        .spinner-box p {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 0;
        }

        .btn-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 992px) {
            .btn-menu { position: relative; top: auto; left: auto; margin: 0 16px 16px 16px; }
            .theme-toggle { top: 16px; right: 16px; width: 44px; height: 44px; }
            body { padding-top: 12px; }
            .page-title { font-size: 1.8rem; margin-left: 16px; }
            .card-modern { margin-left: 16px; margin-right: 16px; }
        }

        @media (max-width: 768px) {
            .container { padding-left: 0; padding-right: 0; max-width: 100%; }
            .page-title {
                font-size: 1.4rem;
                margin: 0 12px 12px 12px;
            }
            .page-title i { font-size: 1.4rem; }
            .card-modern {
                border-radius: 20px;
                padding: 16px !important;
                margin: 0 12px 12px 12px;
            }
            .calendar-header { gap: 8px; }
            .calendar-header h3 { font-size: 1.2rem; }
            .btn-circle { width: 40px; height: 40px; font-size: 1rem; }
            .calendar-grid { gap: 4px; }
            .calendar-day {
                min-height: 80px;
                border-radius: 10px;

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
'use strict';

/* ============================================================
   TEMA CLARO / OSCURO
   ============================================================ */
(function initTheme() {
    const saved = localStorage.getItem('lumen-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeIcon(theme);
})();

function updateThemeIcon(theme) {
    const icon = document.getElementById('themeIcon');
    if (!icon) return;
    icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars';
}

document.getElementById('themeToggle')?.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('lumen-theme', next);
    updateThemeIcon(next);
});

// Atajo de teclado "T"
document.addEventListener('keydown', (e) => {
    if (!e || typeof e.key !== 'string') return;
    if (e.key.toLowerCase() === 't' && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const tag = document.activeElement?.tagName;
        if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
            document.getElementById('themeToggle')?.click();
        }
    }
});

/* ============================================================
   UTILIDADES
   ============================================================ */
function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// Devuelve fecha local en formato YYYY-MM-DD (sin pasar por UTC)
function getLocalDateStr(d = new Date()) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let currentEvents = [];
let selectedEventId = null;

/* ============================================================
   MODAL NOTIFICACIÓN
   ============================================================ */
function showNotification(title, bodyHTML, type = 'info') {
    const modalEl = document.getElementById('notificationModal');
    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    const header = document.getElementById('notificationHeader');
    const titleEl = document.getElementById('notificationTitle');
    const bodyEl = document.getElementById('notificationBody');

    header.className = 'modal-header';
    let iconHTML = '';

    if (type === 'success') {
        header.classList.add('header-success');
        iconHTML = '<i class="bi bi-check-circle-fill notification-icon success"></i>';
    } else if (type === 'error') {
        header.classList.add('header-error');
        iconHTML = '<i class="bi bi-x-circle-fill notification-icon error"></i>';
    } else if (type === 'warning') {
        header.classList.add('header-warning');
        iconHTML = '<i class="bi bi-exclamation-triangle-fill notification-icon warning"></i>';
    } else {
        header.classList.add('header-info');
        iconHTML = '<i class="bi bi-info-circle-fill notification-icon info"></i>';
    }

    titleEl.textContent = title;
    bodyEl.innerHTML = iconHTML + bodyHTML;
    modal.show();
}

function showConfirm(title, bodyHTML, onConfirm) {
    const modalEl = document.getElementById('confirmModal');
    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    document.getElementById('confirmBody').innerHTML =
        `<h6 class="fw-bold mb-2" style="color:var(--text-primary);">${escapeHTML(title)}</h6>${bodyHTML}`;

    const confirmBtn = document.getElementById('confirmBtn');
    const newBtn = confirmBtn.cloneNode(true);
    confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);
    newBtn.addEventListener('click', function () {
        modal.hide();
        setTimeout(() => onConfirm(), 200);
    });
    modal.show();
}

function showLoading() {
    document.getElementById('loadingOverlay').classList.add('active');
}
function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('active');
}

/* ============================================================
   NAVEGACIÓN DE MES
   ============================================================ */
function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    const select = document.getElementById('userFilterSelect');
    const filterValue = select ? select.value : 'all';
    loadCalendarWithFilter(filterValue);
}

async function loadCalendar() {
    const select = document.getElementById('userFilterSelect');
    const filterValue = select ? select.value : 'all';
    await loadCalendarWithFilter(filterValue);
}

/* ============================================================
   CARGAR CALENDARIO CON FILTRO
   ============================================================ */
async function loadCalendarWithFilter(filterValue) {
    showLoading();
    const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    document.getElementById('monthTitle').textContent = `${monthNames[currentMonth]} ${currentYear}`;

    try {
        let url = `/api/agenda/events/${currentYear}/${currentMonth + 1}`;
        if (filterValue) url += `?user_filter=${filterValue}`;

        const response = await fetch(url);
        currentEvents = await response.json();

        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const today = new Date();

        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement('div');
            empty.className = 'calendar-day other-month';
            grid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayEvents = currentEvents.filter(e => e.event_date === dateStr);
            const isToday = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === day;
            const dayOfWeek = new Date(currentYear, currentMonth, day).getDay();
            const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;

            const dayDiv = document.createElement('div');
            dayDiv.className = `calendar-day ${isToday ? 'today' : ''} ${dayEvents.length > 0 ? 'has-events' : ''} ${isWeekend ? 'weekend' : ''}`;
            dayDiv.setAttribute('onclick', `openCreateModal('${dateStr}')`);

            const numberSpan = document.createElement('div');
            numberSpan.className = 'day-number';
            numberSpan.textContent = day;
            dayDiv.appendChild(numberSpan);

            // Responsive: en móvil 2, en desktop todos
            const isMobile = window.innerWidth <= 480;
            const eventsToShow = isMobile ? dayEvents.slice(0, 2) : dayEvents;

            eventsToShow.forEach(ev => {
                const badge = document.createElement('div');
                let badgeClass = `event-badge event-${ev.event_type}`;
                if (ev.is_completed) badgeClass += ' event-completed';
                badge.className = badgeClass;
                badge.textContent = ev.title;
                badge.setAttribute('onclick', `event.stopPropagation(); openEventDetail(${ev.id})`);
                dayDiv.appendChild(badge);
            });

            if (isMobile && dayEvents.length > 2) {
                const more = document.createElement('div');
                more.className = 'event-badge';
                more.style.background = 'var(--accent-dark)';
                more.style.color = 'white';
                more.textContent = `+${dayEvents.length - 2} más`;
                more.setAttribute('onclick', `event.stopPropagation(); openCreateModal('${dateStr}')`);
                dayDiv.appendChild(more);
            }

            grid.appendChild(dayDiv);
        }

        hideLoading();
        loadUpcomingEvents();
        updateDayEvents();
    } catch (error) {
        hideLoading();
        showNotification('Error', `<p>${escapeHTML(error.message)}</p>`, 'error');
    }
}

/* ============================================================
   CARGAR USUARIOS PARA FILTRO (SOLO ADMIN)
   ============================================================ */
async function loadUserFilter() {
    try {
        const response = await fetch('/api/agenda/users');
        if (response.ok) {
            const users = await response.json();
            const select = document.getElementById('userFilterSelect');
            document.getElementById('userFilterContainer').style.display = 'block';

            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user.id;
                option.textContent = `👤 ${user.full_name} (${user.role})`;
                select.appendChild(option);
            });
        }
    } catch (error) {
        console.log('Error al cargar usuarios:', error);
    }
}

function applyUserFilter() {
    const select = document.getElementById('userFilterSelect');
    loadCalendarWithFilter(select.value);
}

/* ============================================================
   MODAL CREAR EVENTO
   ============================================================ */
function openCreateModal(dateStr) {
    document.getElementById('eventForm').reset();
    document.getElementById('eventDate').value = dateStr;
    document.getElementById('expedienteManual').value = '';

    // Resetear header
    const header = document.querySelector('#createEventModal .modal-header');
    if (header) {
        header.className = 'modal-header header-dark';
        header.querySelector('.modal-title').innerHTML =
            '<i class="bi bi-plus-circle"></i> Nuevo evento';
    }

    const saveBtn = document.getElementById('saveEventBtn');
    const newSaveBtn = saveBtn.cloneNode(true);
    saveBtn.parentNode.replaceChild(newSaveBtn, saveBtn);

    const freshBtn = document.getElementById('saveEventBtn');
    freshBtn.innerHTML = '<i class="bi bi-check2"></i> Guardar Evento';
    freshBtn.className = 'btn btn-success btn-lg-modern';
    delete freshBtn.dataset.editId;

    freshBtn.addEventListener('click', async function () {
        const title = document.getElementById('eventTitle').value.trim();
        const eventType = document.getElementById('eventType').value;

        if (!title || !eventType) {
            showNotification('Campos incompletos',
                '<p>Completa título y tipo de evento.</p>', 'warning');
            return;
        }

        showConfirm('Guardar Evento',
            `<p>¿Guardar el evento <strong>${escapeHTML(title)}</strong>?</p>`,
            async function () {
                showLoading();

                const form = document.getElementById('eventForm');
                const formData = new FormData();
                formData.append('title', form.querySelector('#eventTitle').value);
                formData.append('event_type', form.querySelector('#eventType').value);
                formData.append('description', form.querySelector('#eventDescription').value);
                formData.append('event_date', form.querySelector('#eventDate').value);
                formData.append('event_time', form.querySelector('#eventTime').value);
                formData.append('location', form.querySelector('#eventLocation').value);
                formData.append('expediente_manual', document.getElementById('expedienteManual').value);

                try {
                    const response = await fetch('/api/agenda/create', { method: 'POST', body: formData });
                    hideLoading();
                    if (!response.ok) {
                        const error = await response.json();
                        showNotification('Error', `<p>${escapeHTML(error.detail || 'Error al guardar')}</p>`, 'error');
                        return;
                    }
                    showNotification('Evento Creado',
                        '<p>El evento se creó correctamente.</p>', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('createEventModal')).hide();
                    loadCalendar();
                } catch (error) {
                    hideLoading();
                    showNotification('Error', `<p>${escapeHTML(error.message)}</p>`, 'error');
                }
            });
    });

    bootstrap.Modal.getOrCreateInstance(document.getElementById('createEventModal')).show();
}

/* ============================================================
   EVENTOS DEL DÍA
   ============================================================ */
async function updateDayEvents() {
    const today = getLocalDateStr();
    const now = new Date();
    const todayYear = now.getFullYear();
    const todayMonth = now.getMonth() + 1;

    // Si hoy está en el mes visible, usamos currentEvents (evita otra llamada)
    let eventsToSearch = null;
    if (todayYear === currentYear && todayMonth === (currentMonth + 1)) {
        eventsToSearch = currentEvents;
    } else {
        // Si no, hacemos una llamada explícita al mes de hoy
        try {
            const select = document.getElementById('userFilterSelect');
            const filter = select ? select.value : 'all';
            let url = `/api/agenda/events/${todayYear}/${todayMonth}`;
            if (filter) url += `?user_filter=${filter}`;
            const res = await fetch(url);
            if (res.ok) eventsToSearch = await res.json();
        } catch (e) { eventsToSearch = null; }
    }

    const container = document.getElementById('dayEvents');
    if (!eventsToSearch) {
        container.innerHTML = '<p class="text-muted" style="font-size:0.9rem;">No hay eventos para hoy.</p>';
        return;
    }

    const dayEvents = eventsToSearch.filter(e => e.event_date === today && !e.is_completed);

    if (dayEvents.length === 0) {
        container.innerHTML = '<p class="text-muted" style="font-size:0.9rem;">No hay eventos para hoy.</p>';
        return;
    }

    let html = '';
    dayEvents.forEach((ev, idx) => {
        const title = escapeHTML(ev.title || '');
        const time = escapeHTML(ev.event_time || 'Todo el día');
        const type = escapeHTML(ev.event_type || 'otro');
        const location = ev.location ? `<span><i class="bi bi-geo-alt"></i> ${escapeHTML(ev.location)}</span>` : '';

        html += `
            <div class="day-event-item" style="animation-delay:${idx * 0.05}s;">
                <div class="ev-title">${title}</div>
                <div class="ev-meta">
                    <span><i class="bi bi-clock"></i> ${time}</span>
                    <span class="badge-type ${type}">${type.toUpperCase()}</span>
                    ${location}
                </div>
            </div>`;
    });
    container.innerHTML = html;
}

/* ============================================================
   PRÓXIMOS EVENTOS
   ============================================================ */
async function loadUpcomingEvents() {
    const today = getLocalDateStr();
    const now = new Date();

    try {
        const year = now.getFullYear();
        const month = now.getMonth();
        let allUpcomingEvents = [];

        for (let i = 0; i < 3; i++) {
            const targetMonth = month + i;
            const targetYear = year + Math.floor(targetMonth / 12);
            const adjustedMonth = ((targetMonth % 12) + 12) % 12;

            const response = await fetch(`/api/agenda/events/${targetYear}/${adjustedMonth + 1}`);
            if (response.ok) {
                const events = await response.json();
                allUpcomingEvents = allUpcomingEvents.concat(events);
            }
        }

        const upcoming = allUpcomingEvents
            .filter(e => e.event_date >= today && !e.is_completed)
            .sort((a, b) => a.event_date.localeCompare(b.event_date))
            .slice(0, 8);

        const container = document.getElementById('upcomingEvents');
        if (upcoming.length === 0) {
            container.innerHTML = '<p class="text-muted" style="font-size:0.9rem;">No hay eventos próximos pendientes.</p>';
            return;
        }

        let html = '';
        upcoming.forEach((ev, idx) => {
            const dateObj = new Date(ev.event_date + 'T00:00:00');
            const dateStr = dateObj.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
            const title = escapeHTML(ev.title || '');
            const time = ev.event_time ? '· ' + escapeHTML(ev.event_time) : '';
            const type = escapeHTML(ev.event_type || 'otro');

            html += `
                <div class="upcoming-event-card" style="position:relative;padding-right:80px;animation-delay:${idx * 0.05}s;">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                        <div style="flex:1;min-width:0;">
                            <strong style="font-size:0.9rem;display:block;margin-bottom:4px;color:var(--text-primary);">${title}</strong>
                            <div style="font-size:0.75rem;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
                                <span><i class="bi bi-calendar3"></i> ${dateStr} ${time}</span>
                                <span class="badge-type ${type}" style="font-size:0.6rem;">${type}</span>
                            </div>
                        </div>
                        <div style="display:flex;gap:4px;flex-shrink:0;margin-left:8px;">
                            <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); openEditEventModal(${ev.id})"
                                    style="padding:4px 8px;font-size:0.7rem;border-radius:10px;" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="event.stopPropagation(); deleteEventDirect(${ev.id})"
                                    style="padding:4px 8px;font-size:0.7rem;border-radius:10px;" title="Eliminar">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
        });
        container.innerHTML = html;
    } catch (error) {
        document.getElementById('upcomingEvents').innerHTML =
            '<p class="text-muted" style="font-size:0.9rem;">Error al cargar eventos futuros.</p>';
    }
}

/* ============================================================
   ELIMINAR EVENTO DIRECTO
   ============================================================ */
function deleteEventDirect(eventId) {
    showConfirm('Eliminar Evento',
        '<p>¿Estás seguro de eliminar este evento?</p>',
        async function () {
            showLoading();
            try {
                const response = await fetch(`/api/agenda/delete/${eventId}`, { method: 'DELETE' });
                hideLoading();
                if (response.ok) {
                    showNotification('Evento Eliminado',
                        '<p>El evento se eliminó correctamente.</p>', 'success');
                    loadCalendar();
                } else {
                    showNotification('Error',
                        '<p>No se pudo eliminar el evento.</p>', 'error');
                }
            } catch (error) {
                hideLoading();
                showNotification('Error', `<p>${escapeHTML(error.message)}</p>`, 'error');
            }
        });
}

/* ============================================================
   EDITAR EVENTO
   ============================================================ */
async function openEditEventModal(eventId) {
    if (!eventId || eventId === 'undefined') {
        showNotification('Error', '<p>ID de evento no válido.</p>', 'error');
        return;
    }

    showLoading();

    let event = currentEvents.find(e => e.id === parseInt(eventId));

    if (!event) {
        try {
            const response = await fetch(`/api/agenda/event/${eventId}`);
            if (response.ok) {
                event = await response.json();
            } else {
                hideLoading();
                showNotification('Error',
                    '<p>No se encontró el evento. Recarga la página.</p>', 'error');
                return;
            }
        } catch (error) {
            hideLoading();
            showNotification('Error', `<p>${escapeHTML(error.message)}</p>`, 'error');
            return;
        }
    }

    hideLoading();

    // Llenar formulario
    document.getElementById('eventDate').value = event.event_date || '';
    document.getElementById('eventTitle').value = event.title || '';
    document.getElementById('eventType').value = event.event_type || '';
    document.getElementById('eventTime').value = event.event_time || '';
    document.getElementById('eventLocation').value = event.location || '';
    document.getElementById('eventDescription').value = event.description || '';
    document.getElementById('expedienteManual').value = event.expediente_manual || '';

    // Cambiar header
    const header = document.querySelector('#createEventModal .modal-header');
    if (header) {
        header.className = 'modal-header header-info';
        header.querySelector('.modal-title').innerHTML =
            '<i class="bi bi-pencil-square"></i> Editar evento';
    }

    // Configurar botón
    const saveBtn = document.getElementById('saveEventBtn');
    const newSaveBtn = saveBtn.cloneNode(true);
    saveBtn.parentNode.replaceChild(newSaveBtn, saveBtn);

    const freshBtn = document.getElementById('saveEventBtn');
    freshBtn.innerHTML = '<i class="bi bi-check2"></i> Actualizar Evento';
    freshBtn.className = 'btn btn-primary btn-lg-modern';
    freshBtn.dataset.editId = eventId;

    freshBtn.addEventListener('click', async function () {
        const title = document.getElementById('eventTitle').value.trim();
        const eventType = document.getElementById('eventType').value;

        if (!title || !eventType) {
            showNotification('Campos incompletos',
                '<p>Completa título y tipo de evento.</p>', 'warning');
            return;
        }

        const eventIdToUpdate = freshBtn.dataset.editId;
        if (!eventIdToUpdate || eventIdToUpdate === 'undefined') {
            showNotification('Error', '<p>No se pudo identificar el evento.</p>', 'error');
            return;
        }

        showConfirm('Actualizar Evento',
            `<p>¿Actualizar el evento <strong>${escapeHTML(title)}</strong>?</p>`,
            async function () {
                showLoading();

                const form = document.getElementById('eventForm');
                const formData = new FormData();
                formData.append('title', form.querySelector('#eventTitle').value);
                formData.append('event_type', form.querySelector('#eventType').value);
                formData.append('description', form.querySelector('#eventDescription').value);
                formData.append('event_date', form.querySelector('#eventDate').value);
                formData.append('event_time', form.querySelector('#eventTime').value);
                formData.append('location', form.querySelector('#eventLocation').value);
                formData.append('expediente_manual', document.getElementById('expedienteManual').value);

                try {
                    const response = await fetch(`/api/agenda/update/${eventIdToUpdate}`, {
                        method: 'PUT',
                        body: formData
                    });
                    hideLoading();
                    if (!response.ok) {
                        const error = await response.json();
                        showNotification('Error',
                            `<p>${escapeHTML(error.detail || 'Error al actualizar')}</p>`, 'error');
                        return;
                    }
                    showNotification('Evento Actualizado',
                        '<p>El evento se actualizó correctamente.</p>', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('createEventModal')).hide();

                    // Restaurar botón
                    const restoreBtn = document.getElementById('saveEventBtn');
                    restoreBtn.innerHTML = '<i class="bi bi-check2"></i> Guardar Evento';
                    restoreBtn.className = 'btn btn-success btn-lg-modern';
                    delete restoreBtn.dataset.editId;

                    loadCalendar();
                } catch (error) {
                    hideLoading();
                    showNotification('Error', `<p>${escapeHTML(error.message)}</p>`, 'error');
                }
            });
    });

    bootstrap.Modal.getOrCreateInstance(document.getElementById('createEventModal')).show();
}

/* ============================================================
   DETALLE DEL EVENTO
   ============================================================ */
function openEventDetail(eventId) {
    selectedEventId = eventId;
    const event = currentEvents.find(e => e.id === eventId);
    if (!event) return;

    const typeLabels = {
        audiencia: '🎯 Audiencia',
        plazos: '⏰ Plazo Legal',
        junta: '🤝 Junta',
        otro: '📋 Otro'
    };

    const isCompleted = event.is_completed;

    document.getElementById('eventDetailBody').innerHTML = `
        <h4 style="font-weight:800;color:var(--text-primary);margin-bottom:16px;">${escapeHTML(event.title || '')}</h4>
        <div class="d-flex flex-column gap-2">
            <p class="mb-0"><strong style="color:var(--text-secondary);">Tipo:</strong> ${typeLabels[event.event_type] || escapeHTML(event.event_type || '')}</p>
            <p class="mb-0"><strong style="color:var(--text-secondary);">Fecha:</strong> ${escapeHTML(event.event_date || '')}</p>
            ${event.event_time ? `<p class="mb-0"><strong style="color:var(--text-secondary);">Hora:</strong> ${escapeHTML(event.event_time)}</p>` : ''}
            ${event.location ? `<p class="mb-0"><strong style="color:var(--text-secondary);">Lugar:</strong> ${escapeHTML(event.location)}</p>` : ''}
            ${event.description ? `<p class="mb-0"><strong style="color:var(--text-secondary);">Descripción:</strong> ${escapeHTML(event.description)}</p>` : ''}
            ${event.case_info ? `<p class="mb-0"><strong style="color:var(--text-secondary);">Expediente:</strong> ${escapeHTML(event.case_info)}</p>` : ''}
            ${event.user_name ? `<p class="mb-0"><strong style="color:var(--text-secondary);">Creado por:</strong> ${escapeHTML(event.user_name)}</p>` : ''}
            <p class="mb-0"><strong style="color:var(--text-secondary);">Estado:</strong>
                <span class="status-badge-modern" style="display:inline-block;padding:4px 12px;border-radius:40px;font-size:0.75rem;font-weight:700;background:${isCompleted ? 'var(--success-soft)' : 'var(--warning-soft)'};color:${isCompleted ? 'var(--success)' : '#8a6d00'};">
                    ${isCompleted ? '✅ Completado' : '⏳ Pendiente'}
                </span>
            </p>
        </div>
    `;

    document.getElementById('completeEventBtn').innerHTML =
        isCompleted ? '<i class="bi bi-arrow-counterclockwise"></i> Reabrir' : '<i class="bi bi-check-circle"></i> Completar';
    document.getElementById('deleteEventBtn').style.display = 'inline-block';

    bootstrap.Modal.getOrCreateInstance(document.getElementById('eventDetailModal')).show();
}

/* ============================================================
   COMPLETAR / REABRIR EVENTO

document.getElementById('completeEventBtn').addEventListener('click', async () => {
    try {
        const response = await fetch(`/api/agenda/complete/${selectedEventId}`, { method: 'PUT' });
        if (response.ok) {
            bootstrap.Modal.getInstance(document.getElementById('eventDetailModal')).hide();
            showNotification('Estado Actualizado',
                '<p>El estado del evento se actualizó.</p>', 'success');
            loadCalendar();
        }
    } catch (error) {
        showNotification('Error', `<p>${escapeHTML(error.message)}</p>`, 'error');
    }
});

/* ============================================================
   ELIMINAR EVENTO (desde detalle)
   ============================================================ */
document.getElementById('deleteEventBtn').addEventListener('click', () => {
    showConfirm('Eliminar Evento',
        '<p>¿Estás seguro de eliminar este evento?</p>',

                const response = await fetch(`/api/agenda/delete/${selectedEventId}`, { method: 'DELETE' });

});

function openReportModal() {
    const container = document.getElementById('reportUserFilterContainer');
    const select = document.getElementById('reportUserFilter');
    const mainSelect = document.getElementById('userFilterSelect');

    if (mainSelect && mainSelect.options.length > 0) {
        container.style.display = 'block';
        select.innerHTML = mainSelect.innerHTML;
    }

    bootstrap.Modal.getOrCreateInstance(document.getElementById('reportModal')).show();
}

function generarReporte() {
    const periodo = document.getElementById('reportPeriod').value;
    const filtro = document.getElementById('reportFilter').value;

    let userFilter = 'all';
    const reportUserFilter = document.getElementById('reportUserFilter');
    if (reportUserFilter) userFilter = reportUserFilter.value;

    showLoading();
    window.open(`/api/agenda/report-pdf?periodo=${periodo}&filtro=${filtro}&user_filter=${userFilter}`, '_blank');
    setTimeout(() => hideLoading(), 1500);
}

    loadCalendar();

    document.getElementById('applyFilterBtn')?.addEventListener('click', applyUserFilter);
}

initAgenda();
