<!DOCTYPE html>
<html>
<head>
    <title>Usuarios - Lumen Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .btn-menu { position: fixed; top: 20px; left: 20px; z-index: 1000; }
        .modal-content { border-radius: 15px; }
        .permission-badge { font-size: 11px; }
    </style>
</head>
<body class="bg-light">
<a href="/" class="btn btn-outline-dark btn-menu">← Menú Principal</a>
<div class="container mt-5">
    <h1 class="text-center mb-4">👥 Gestión de Usuarios</h1>
    <div class="card p-4 shadow">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="mb-0"><strong>Usuarios Registrados</strong></h5>
            <div>
                <a href="/auth/register" class="btn btn-primary btn-sm">+ Nuevo Usuario</a>
                <a href="/auth/logout" class="btn btn-danger btn-sm">🚪 Cerrar Sesión</a>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Permisos</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {{ rows }}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal para restablecer contraseña -->
<div class="modal fade" id="resetPasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title">🔑 Restablecer Contraseña</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Nueva contraseña para: <strong id="resetUserName"></strong></p>
                <input type="password" id="newPasswordInput" class="form-control form-control-lg" placeholder="Nueva contraseña..." autocomplete="off">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" id="confirmResetBtn" class="btn btn-warning">Restablecer</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal para editar permisos -->
<div class="modal fade" id="editPermissionsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title">⚙️ Editar Permisos</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Permisos para: <strong id="editPermUserName"></strong></p>
                <input type="hidden" id="editPermUserId">
                <div class="border rounded p-3">
                    <div class="form-check"><input class="form-check-input" type="checkbox" value="clients" id="edit_perm_clients"><label class="form-check-label" for="edit_perm_clients">👤 Registrar Clientes</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" value="contracts" id="edit_perm_contracts"><label class="form-check-label" for="edit_perm_contracts">📜 Contratación</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" value="cases" id="edit_perm_cases"><label class="form-check-label" for="edit_perm_cases">📁 Relacionar Expediente</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" value="payments" id="edit_perm_payments"><label class="form-check-label" for="edit_perm_payments">💰 Abonos y Pagos</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" value="actuaciones" id="edit_perm_actuaciones"><label class="form-check-label" for="edit_perm_actuaciones">📄 Expediente Electrónico</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" value="consult" id="edit_perm_consult"><label class="form-check-label" for="edit_perm_consult">🔍 Consultas</label></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" id="savePermissionsBtn" class="btn btn-info">💾 Guardar Permisos</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal de notificaciones -->
<div class="modal fade" id="notificationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" id="notificationHeader">
                <h5 class="modal-title" id="notificationTitle">Notificación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="notificationBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal de confirmación -->
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title">⚠️ Confirmación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="confirmBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-lg" data-bs-dismiss="modal">❌ Cancelar</button>
                <button type="button" class="btn btn-success btn-lg" id="confirmBtn">✅ Confirmar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function showNotification(title, bodyHTML, type = 'info') {
    const modal = new bootstrap.Modal(document.getElementById('notificationModal'));
    const header = document.getElementById('notificationHeader');
    const titleEl = document.getElementById('notificationTitle');
    const bodyEl = document.getElementById('notificationBody');
    header.className = 'modal-header';
    if (type === 'success') { header.classList.add('bg-success', 'text-white'); titleEl.textContent = '✅ ' + title; }
    else if (type === 'error') { header.classList.add('bg-danger', 'text-white'); titleEl.textContent = '❌ ' + title; }
    else if (type === 'warning') { header.classList.add('bg-warning', 'text-dark'); titleEl.textContent = '⚠️ ' + title; }
    else { header.classList.add('bg-primary', 'text-white'); titleEl.textContent = 'ℹ️ ' + title; }
    bodyEl.innerHTML = bodyHTML;
    modal.show();
}

function showConfirm(title, bodyHTML, onConfirm) {
    const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
    document.getElementById('confirmBody').innerHTML = bodyHTML;
    document.getElementById('confirmBtn').onclick = function() { modal.hide(); setTimeout(onConfirm, 200); };
    modal.show();
}

let currentResetUserId = null;

// Restablecer contraseña
document.querySelectorAll('.reset-password').forEach(btn => {
    btn.addEventListener('click', function() {
        currentResetUserId = this.dataset.id;
        document.getElementById('resetUserName').textContent = this.dataset.name;
        document.getElementById('newPasswordInput').value = '';
        new bootstrap.Modal(document.getElementById('resetPasswordModal')).show();
    });
});

document.getElementById('confirmResetBtn').addEventListener('click', async () => {
    const newPassword = document.getElementById('newPasswordInput').value;
    if (!newPassword) {
        showNotification('Contraseña vacía', '<p>Por favor ingresa una nueva contraseña.</p>', 'warning');
        return;
    }
    
    bootstrap.Modal.getInstance(document.getElementById('resetPasswordModal')).hide();
    
    setTimeout(() => {
        showConfirm('Restablecer Contraseña', '<p>¿Estás seguro de restablecer la contraseña de este usuario?</p>', async function() {
            const formData = new FormData();
            formData.append('new_password', newPassword);
            
            try {
                const response = await fetch(`/auth/reset-password/${currentResetUserId}`, { method: 'POST', body: formData });
                if (!response.ok) { const error = await response.json(); showNotification('Error', `<p>${error.detail || 'Error'}</p>`, 'error'); return; }
                showNotification('Contraseña Restablecida', '<p>La contraseña se restableció correctamente.</p>', 'success');
                setTimeout(() => location.reload(), 1500);
            } catch (error) {
                showNotification('Error', `<p>${error.message}</p>`, 'error');
            }
        });
    }, 300);
});

// Editar permisos
document.querySelectorAll('.edit-permissions').forEach(btn => {
    btn.addEventListener('click', function() {
        const userId = this.dataset.id;
        const name = this.dataset.name;
        const permissions = this.dataset.permissions || '';
        
        document.getElementById('editPermUserId').value = userId;
        document.getElementById('editPermUserName').textContent = name;
        
        document.querySelectorAll('#editPermissionsModal input[type="checkbox"]').forEach(cb => { cb.checked = false; });
        
        if (permissions === 'all') {
            document.querySelectorAll('#editPermissionsModal input[type="checkbox"]').forEach(cb => { cb.checked = true; });
        } else {
            permissions.split(',').forEach(perm => {
                const cb = document.getElementById('edit_perm_' + perm.trim());
                if (cb) cb.checked = true;
            });
        }
        
        new bootstrap.Modal(document.getElementById('editPermissionsModal')).show();
    });
});

document.getElementById('savePermissionsBtn').addEventListener('click', async () => {
    const userId = document.getElementById('editPermUserId').value;
    const selectedPermissions = [];
    document.querySelectorAll('#editPermissionsModal input[type="checkbox"]:checked').forEach(cb => { selectedPermissions.push(cb.value); });
    
    const formData = new FormData();
    formData.append('permissions', selectedPermissions.join(','));
    
    try {
        const response = await fetch(`/auth/update-permissions/${userId}`, { method: 'POST', body: formData });
        if (!response.ok) { const error = await response.json(); showNotification('Error', `<p>${error.detail || 'Error'}</p>`, 'error'); return; }
        
        bootstrap.Modal.getInstance(document.getElementById('editPermissionsModal')).hide();
        showNotification('Permisos Actualizados', '<p>Los permisos se actualizaron correctamente.</p>', 'success');
        
        // Si se editó a sí mismo, refrescar la cookie
        // Obtener el ID del usuario actual desde el token
        const sessionResponse = await fetch('/auth/check-session');
        const sessionData = await sessionResponse.json();
        
        if (sessionData.authenticated && sessionData.user_id == userId) {
            // Refrescar permisos del usuario actual
            await fetch('/auth/refresh-permissions', { method: 'POST' });
        }
        
        setTimeout(() => location.reload(), 1500);
        
    } catch (error) {
        showNotification('Error', `<p>${error.message}</p>`, 'error');
    }
});
</script>
</body>
</html>
