<!DOCTYPE html>
<html>
<head>
    <title>Cambiar Contraseña · Lumen Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f2f5fb;
            position: relative;
            overflow: hidden;
        }

        /* Fondo decorativo */
        body::before {
            content: '';
            position: fixed;
            top: -40%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(42,109,244,0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(42,109,244,0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .password-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .password-card {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 36px 32px 32px;
            box-shadow: 0 24px 56px -16px rgba(0,20,40,0.16);
            border: 1px solid rgba(255,255,255,0.5);
            transition: box-shadow 0.2s;
        }
        .password-card:hover {
            box-shadow: 0 32px 72px -20px rgba(0,20,40,0.2);
        }

        /* Icono */
        .icon-wrapper {
            width: 72px;
            height: 72px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(42,109,244,0.1), rgba(42,109,244,0.03));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }
        .icon-wrapper i {
            font-size: 2.4rem;
            color: #2a6df4;
        }

        .password-title {
            font-weight: 700;
            font-size: 1.8rem;
            color: #0b1e33;
            text-align: center;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }
        .password-subtitle {
            text-align: center;
            color: #6b7b8f;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .password-subtitle span {
            background: #eef3fa;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2a4a7a;
        }

        /* Campos de formulario */
        .form-floating-custom {
            position: relative;
            margin-bottom: 16px;
        }
        .form-floating-custom .form-control {
            border-radius: 16px;
            border: 1.5px solid #e9edf4;
            padding: 14px 18px 14px 46px;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.6);
            transition: all 0.2s;
            height: 56px;
        }
        .form-floating-custom .form-control:focus {
            border-color: #2a6df4;
            box-shadow: 0 0 0 4px rgba(42,109,244,0.08);
            background: white;
        }
        .form-floating-custom .form-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a9bb0;
            font-size: 1.1rem;
            pointer-events: none;
            z-index: 2;
            transition: color 0.2s;
        }
        .form-floating-custom .form-control:focus + .form-icon,
        .form-floating-custom .form-control:not(:placeholder-shown) + .form-icon {
            color: #2a6df4;
        }

        .form-floating-custom .form-label {
            position: absolute;
            left: 46px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 600;
            font-size: 0.85rem;
            color: #8a9bb0;
            pointer-events: none;
            transition: all 0.2s;
            background: transparent;
            padding: 0 4px;
            margin: 0;
        }
        .form-floating-custom .form-control:focus ~ .form-label,
        .form-floating-custom .form-control:not(:placeholder-shown) ~ .form-label {
            top: 8px;
            transform: translateY(0);
            font-size: 0.65rem;
            color: #2a6df4;
            background: white;
            padding: 0 6px;
            border-radius: 6px;
        }

        /* Botón */
        .btn-change {
            background: #0b1e33;
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            width: 100%;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }
        .btn-change:hover {
            background: #1a3b6b;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(11,30,51,0.25);
        }
        .btn-change:active {
            transform: scale(0.97);
        }

        /* Enlace volver */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #6b7b8f;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #2a6df4;
        }
        .back-link i {
            margin-right: 4px;
        }

        .footer-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.7rem;
            color: #8a9bb0;
            letter-spacing: 0.02em;
        }
        .footer-text i {
            color: #2a6df4;
        }

        /* Alertas */
        .alert-custom {
            border-radius: 16px;
            padding: 12px 18px;
            margin-bottom: 20px;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .alert-custom i {
            font-size: 1.2rem;
        }
        .alert-custom.d-none {
            display: none !important;
        }
        .alert-custom.alert-success {
            background: #e3f5ee;
            color: #1a6b4c;
        }
        .alert-custom.alert-danger {
            background: #fde8e6;
            color: #7a2a2a;
        }
        .alert-custom.alert-warning {
            background: #fdf3e0;
            color: #7a5a1a;
        }
        .alert-custom.alert-info {
            background: #e3effa;
            color: #1f4f7a;
        }

        /* Modal moderno */
        .modal-modern .modal-content {
            border-radius: 28px;
            border: none;
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.2);
            overflow: hidden;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(8px);
        }
        .modal-modern .modal-header {
            border-bottom: none;
            padding: 20px 28px 8px 28px;
        }
        .modal-modern .modal-header .modal-title {
            font-weight: 700;
            color: #0b1e33;
        }
        .modal-modern .modal-body {
            padding: 16px 28px 24px;
        }
        .modal-modern .modal-footer {
            border-top: none;
            padding: 8px 28px 24px;
        }
        .modal-modern .btn-close-white {
            filter: brightness(0) invert(1);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .password-card { padding: 24px 20px; }
            .password-title { font-size: 1.4rem; }
            .form-floating-custom .form-control { height: 50px; padding: 12px 14px 12px 42px; font-size: 0.9rem; }
            .form-floating-custom .form-icon { font-size: 1rem; left: 14px; }
            .icon-wrapper { width: 56px; height: 56px; }
            .icon-wrapper i { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="password-container">

    <!-- Tarjeta principal -->
    <div class="password-card">

        <!-- Icono -->
        <div class="icon-wrapper">
            <i class="bi bi-key"></i>
        </div>

        <!-- Títulos -->
        <h1 class="password-title">Cambiar Contraseña</h1>
        <div class="password-subtitle">
            Verifica tu identidad
            <span><i class="bi bi-shield-check me-1"></i> Seguro</span>
        </div>

        <!-- Mensaje de error/éxito (se reemplaza dinámicamente) -->
        <div id="messageContainer"></div>

        <!-- Formulario -->
        <form action="/auth/change-password-login" method="post" id="passwordForm">

            <div class="form-floating-custom">
                <input type="email" name="email" id="email" class="form-control"
                       placeholder=" " required autocomplete="off">
                <i class="bi bi-envelope form-icon"></i>
                <label class="form-label">Email</label>
            </div>

            <div class="form-floating-custom">
                <input type="password" name="current_password" id="currentPassword" class="form-control"
                       placeholder=" " required autocomplete="off">
                <i class="bi bi-lock form-icon"></i>
                <label class="form-label">Contraseña Actual</label>
            </div>

            <div class="form-floating-custom">
                <input type="password" name="new_password" id="newPassword" class="form-control"
                       placeholder=" " required autocomplete="off">
                <i class="bi bi-shield-lock form-icon"></i>
                <label class="form-label">Nueva Contraseña</label>
            </div>

            <div class="form-floating-custom">
                <input type="password" name="confirm_password" id="confirmPassword" class="form-control"
                       placeholder=" " required autocomplete="off">
                <i class="bi bi-check-circle form-icon"></i>
                <label class="form-label">Confirmar Nueva</label>
            </div>

            <button type="submit" class="btn-change" id="submitBtn">
                <i class="bi bi-check2"></i> Cambiar Contraseña
            </button>
        </form>

        <!-- Enlace volver -->
        <a href="/auth/login" class="back-link">
            <i class="bi bi-arrow-left"></i> Volver al Login
        </a>

        <!-- Footer -->
        <div class="footer-text">
            <i class="bi bi-shield-check"></i> Lumen Legal v1.0
        </div>
    </div>

</div>

<!-- ================================================== -->
<!-- MODAL DE NOTIFICACIÓN (moderno) -->
<!-- ================================================== -->
<div class="modal fade modal-modern" id="notificationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" id="notificationHeader">
                <h5 class="modal-title" id="notificationTitle">Notificación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="notificationBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- ================================================== -->
<!-- LOADING OVERLAY -->
<!-- ================================================== -->
<div id="loadingOverlay" class="spinner-overlay" style="display:none;">
    <div class="spinner-box">
        <div class="spinner-border" role="status"></div>
        <h5>Procesando...</h5>
        <p>Un momento, por favor.</p>
    </div>
</div>

<style>
    .spinner-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(11,30,51,0.4);
        backdrop-filter: blur(8px);
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
    }
    .spinner-box {
        background: white;
        padding: 36px 48px;
        border-radius: 32px;
        text-align: center;
        box-shadow: 0 40px 80px -20px rgba(0,0,0,0.2);
    }
    .spinner-box .spinner-border {
        width: 3rem;
        height: 3rem;
        color: #2a6df4;
    }
    .spinner-box h5 {
        font-weight: 700;
        color: #0b1e33;
        margin-top: 12px;
    }
    .spinner-box p {
        color: #6b7b8f;
        font-size: 0.85rem;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Mostrar notificaciones en modal
    function showNotification(title, bodyHTML, type = 'info') {
        const modal = new bootstrap.Modal(document.getElementById('notificationModal'));
        const header = document.getElementById('notificationHeader');
        const titleEl = document.getElementById('notificationTitle');
        const bodyEl = document.getElementById('notificationBody');
        header.className = 'modal-header';
        if (type === 'success') {
            header.classList.add('bg-success', 'text-white');
            titleEl.textContent = '✅ ' + title;
        } else if (type === 'error') {
            header.classList.add('bg-danger', 'text-white');
            titleEl.textContent = '❌ ' + title;
        } else if (type === 'warning') {
            header.classList.add('bg-warning', 'text-dark');
            titleEl.textContent = '⚠️ ' + title;
        } else {
            header.classList.add('bg-primary', 'text-white');
            titleEl.textContent = 'ℹ️ ' + title;
        }
        bodyEl.innerHTML = bodyHTML;
        modal.show();
    }

    // Mostrar mensajes en la página (para errores del backend)
    function showMessage(message, type = 'info') {
        const container = document.getElementById('messageContainer');
        const alertClass = type === 'success' ? 'alert-success' :
                          type === 'error' ? 'alert-danger' :
                          type === 'warning' ? 'alert-warning' : 'alert-info';
        const icon = type === 'success' ? 'bi-check-circle-fill' :
                    type === 'error' ? 'bi-exclamation-triangle-fill' :
                    type === 'warning' ? 'bi-exclamation-circle' : 'bi-info-circle';
        container.innerHTML = `
            <div class="alert-custom ${alertClass}">
                <i class="bi ${icon}"></i>
                <span>${message}</span>
            </div>
        `;
    }

    // Mostrar/ocultar loading
    function showLoading() {
        document.getElementById('loadingOverlay').style.display = 'flex';
    }
    function hideLoading() {
        document.getElementById('loadingOverlay').style.display = 'none';
    }

    // Validación en frontend antes de enviar
    document.getElementById('passwordForm').addEventListener('submit', function(e) {
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;

        if (newPass.length < 8) {
            e.preventDefault();
            showMessage('La nueva contraseña debe tener al menos 8 caracteres.', 'warning');
            return;
        }

        if (newPass !== confirmPass) {
            e.preventDefault();
            showMessage('Las contraseñas no coinciden. Por favor, verifica.', 'warning');
            return;
        }

        // Mostrar loading
        showLoading();
    });

    // Verificar si hay mensaje de error del backend
    document.addEventListener('DOMContentLoaded', function() {
        // Si hay algún mensaje de error en la URL (flash message)
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const success = params.get('success');

        if (error) {
            showMessage(decodeURIComponent(error), 'error');
        } else if (success) {
            showMessage(decodeURIComponent(success), 'success');
        }
    });

    // Manejar respuesta del formulario (si se envía con AJAX o fetch)
    // Esto es para mostrar notificaciones si se usa fetch
    // Pero como el formulario usa submit tradicional, dejamos que el backend maneje la redirección
</script>

</body>
</html>
