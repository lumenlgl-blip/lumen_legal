<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1e33" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a1523" media="(prefers-color-scheme: dark)">
    <title>Cambiar Contraseña · Lumen Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           VARIABLES DE TEMA
           ============================================================ */
        :root {
            --bg-primary: #f2f5fb;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f8fafc;
            --surface-glass: rgba(255,255,255,0.85);
            --surface-glass-strong: rgba(255,255,255,0.96);
            --border-subtle: rgba(255,255,255,0.5);
            --border-soft: #e9edf4;
            --border-strong: #d0d8e3;
            --text-primary: #0b1e33;
            --text-secondary: #4a5b6e;
            --text-muted: #6b7b8f;
            --text-light: #8a9bb0;
            --accent-primary: #2a6df4;
            --accent-light: #7aa9ff;
            --accent-dark: #0b1e33;
            --accent-dark-hover: #1a3b6b;
            --success: #1a8b5c;
            --success-hover: #0e6b46;
            --success-soft: #d1fae5;
            --warning: #f5b342;
            --warning-soft: #fdf3e0;
            --warning-text: #b7791f;
            --danger: #dc3545;
            --danger-hover: #b02a37;
            --danger-soft: #fee9e7;
            --info: #1f6f9e;
            --info-soft: #e3effa;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 48px -12px rgba(0,20,40,0.12);
            --shadow-xl: 0 40px 80px -20px rgba(0,0,0,0.2);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 28px;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0a1523;
            --bg-secondary: #111d2e;
            --bg-tertiary: #16243a;
            --surface-glass: rgba(22,36,58,0.78);
            --surface-glass-strong: rgba(22,36,58,0.94);
            --border-subtle: rgba(255,255,255,0.08);
            --border-soft: #223147;
            --border-strong: #2d3f5a;
            --text-primary: #e8eef7;
            --text-secondary: #b8c5d6;
            --text-muted: #8a9bb0;
            --text-light: #6b7b8f;
            --accent-primary: #5b93ff;
            --accent-light: #a8c5ff;
            --accent-dark: #5b93ff;
            --accent-dark-hover: #7aa9ff;
            --success: #34d399;
            --success-hover: #10b981;
            --success-soft: rgba(52,211,153,0.15);
            --warning: #fbbf24;
            --warning-soft: rgba(251,191,36,0.15);
            --warning-text: #fbbf24;
            --danger: #f87171;
            --danger-hover: #ef4444;
            --danger-soft: rgba(248,113,113,0.15);
            --info: #60a5fa;
            --info-soft: rgba(96,165,250,0.15);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 20px 48px -12px rgba(0,0,0,0.5);
            --shadow-xl: 0 40px 80px -20px rgba(0,0,0,0.6);
        }

        * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            background: var(--bg-primary);
            background-image:
                radial-gradient(at 100% 0%, rgba(42,109,244,0.08) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(42,109,244,0.05) 0px, transparent 50%);
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
            transition: background-color var(--transition-normal), color var(--transition-normal);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Blobs decorativos */
        body::before {
            content: '';
            position: fixed;
            top: -40%; right: -20%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(42,109,244,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatSlow 15s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%; left: -15%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(42,109,244,0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatSlow 18s ease-in-out infinite reverse;
        }
        @keyframes floatSlow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }

        /* ============================================================
           THEME TOGGLE
           ============================================================ */
        .theme-toggle {
            position: fixed;
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            z-index: 1050;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--surface-glass-strong);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: all var(--transition-normal);
        }
        .theme-toggle:hover {
            transform: translateY(-2px) rotate(15deg);
            box-shadow: var(--shadow-lg);
            color: var(--accent-primary);
        }
        .theme-toggle:active { transform: scale(0.95); }

        /* ============================================================
           CONTAINER
           ============================================================ */
        .password-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .password-card {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-xl);
            padding: 40px 36px 32px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-subtle);
            transition: box-shadow var(--transition-normal);
            position: relative;
            overflow: hidden;
            animation: cardEnter 0.6s var(--transition-bounce);
        }

        /* Línea superior con gradiente animado */
        .password-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-light), var(--success));
            background-size: 200% 100%;
            animation: gradientSlide 4s ease infinite;
        }
        @keyframes gradientSlide {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .password-card:hover { box-shadow: var(--shadow-xl); }

        /* ============================================================
           ICONO
           ============================================================ */
        .icon-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 26px;
            background: linear-gradient(135deg, var(--info-soft), rgba(42,109,244,0.03));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            position: relative;
            border: 1.5px solid rgba(42,109,244,0.15);
        }
        .icon-wrapper i {
            font-size: 2.5rem;
            color: var(--accent-primary);
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 4px 12px rgba(42,109,244,0.25));
        }
        .icon-wrapper .pulse-ring {
            position: absolute;
            inset: 0;
            border-radius: 26px;
            border: 2px solid var(--accent-primary);
            animation: pulseRing 2.4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pulseRing {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0; }
        }

        /* ============================================================
           TÍTULOS
           ============================================================ */
        .password-title {
            font-weight: 800;
            font-size: 1.7rem;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        .password-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.92rem;
            margin-bottom: 26px;
            line-height: 1.5;
        }
        .password-subtitle .highlight {
            background: var(--info-soft);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent-primary);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.02em;
            margin-top: 6px;
        }
        .password-subtitle .highlight i { font-size: 0.8rem; }

        /* ============================================================
           ALERTAS (para flash messages)
           ============================================================ */
        .alert-custom {
            border-radius: var(--radius-md);
            padding: 14px 18px;
            margin-bottom: 20px;
            border: none;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            animation: slideIn 0.4s var(--transition-bounce);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-12px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .alert-custom i {
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .alert-custom.alert-success {
            background: var(--success-soft);
            color: var(--success);
        }
        [data-theme="dark"] .alert-custom.alert-success { color: var(--success); }
        .alert-custom.alert-danger {
            background: var(--danger-soft);
            color: var(--danger);
        }
        .alert-custom.alert-warning {
            background: var(--warning-soft);
            color: var(--warning-text);
        }
        [data-theme="dark"] .alert-custom.alert-warning { color: var(--warning); }
        .alert-custom.alert-info {
            background: var(--info-soft);
            color: var(--info);
        }

        /* ============================================================
           FORM FIELD — LABELS ARRIBA
           ============================================================ */
        .pwd-field {
            margin-bottom: 20px;
            position: relative;
            animation: fadeInUp 0.5s ease-out backwards;
        }
        .pwd-field:nth-of-type(1) { animation-delay: 0.15s; }
        .pwd-field:nth-of-type(2) { animation-delay: 0.2s; }
        .pwd-field:nth-of-type(3) { animation-delay: 0.25s; }
        .pwd-field:nth-of-type(4) { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pwd-field .field-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-left: 2px;
            transition: color var(--transition-fast);
        }
        .pwd-field .field-label i {
            color: var(--accent-primary);
            font-size: 0.9rem;
        }
        .pwd-field .field-label .required {
            color: var(--danger);
            margin-left: 2px;
        }
        .pwd-field:focus-within .field-label {
            color: var(--text-primary);
        }

        /* Wrapper del input */
        .pwd-field .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Input con icono izquierdo + toggle derecho */
        .pwd-field .form-control {
            width: 100%;
            height: 56px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border-soft);
            padding: 0 52px 0 48px;
            font-size: 0.98rem;
            font-weight: 500;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: border-color var(--transition-fast),
                        box-shadow var(--transition-fast),
                        background-color var(--transition-fast);
            outline: none;
        }
        .pwd-field .form-control::placeholder {
            color: var(--text-light);
            font-weight: 400;
            opacity: 0.85;
        }
        .pwd-field .form-control:hover {
            border-color: var(--border-strong);
        }
        .pwd-field .form-control:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(42,109,244,0.12);
            background: var(--bg-secondary);
        }
        .pwd-field .form-control.is-invalid {
            border-color: var(--danger);
            background-image: none;
        }
        .pwd-field .form-control.is-invalid:focus {
            box-shadow: 0 0 0 4px rgba(220,53,69,0.12);
        }

        /* Input sin botón toggle (email) */
        .pwd-field .form-control.no-toggle {
            padding-right: 18px;
        }

        /* Icono izquierdo */
        .pwd-field .field-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.1rem;
            pointer-events: none;
            z-index: 2;
            transition: color var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pwd-field:focus-within .field-icon {
            color: var(--accent-primary);
        }

        /* Toggle ver/ocultar contraseña */
        .pwd-field .pwd-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 1.1rem;
            padding: 8px;
            cursor: pointer;
            border-radius: 10px;
            transition: all var(--transition-fast);
            z-index: 3;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .pwd-field .pwd-toggle:hover {
            color: var(--accent-primary);
            background: rgba(42,109,244,0.08);
        }
        .pwd-field .pwd-toggle:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        /* ============================================================
           MEDIDOR DE FORTALEZA
           ============================================================ */
        .strength-meter {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeInUp 0.3s ease-out;
        }
        .strength-bar {
            flex: 1;
            height: 6px;
            border-radius: 6px;
            background: var(--border-soft);
            overflow: hidden;
        }
        .strength-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.35s ease, background-color 0.35s ease;
            background: var(--border-soft);
        }
        .strength-bar-fill.weak { width: 33%; background: var(--danger); }
        .strength-bar-fill.medium { width: 66%; background: var(--warning); }
        .strength-bar-fill.strong { width: 100%; background: var(--success); }

        .strength-label {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-light);
            min-width: 60px;
            text-align: right;
            transition: color var(--transition-fast);
        }
        .strength-label.weak { color: var(--danger); }
        .strength-label.medium { color: var(--warning); }
        .strength-label.strong { color: var(--success); }

        /* ============================================================
           REQUISITOS
           ============================================================ */
        .password-requirements {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-top: 10px;
            border: 1px solid var(--border-soft);
            animation: fadeInUp 0.3s ease-out;
        }
        .password-requirements .req-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: color var(--transition-normal);
        }
        .password-requirements .req-item i {
            font-size: 0.82rem;
            transition: transform var(--transition-fast);
        }
        .password-requirements .req-item.valid { color: var(--success); }
        .password-requirements .req-item.valid i { transform: scale(1.15); }
        .password-requirements .req-item.invalid { color: var(--danger); }

        /* ============================================================
           BOTÓN PRINCIPAL
           ============================================================ */
        .btn-change {
            background: var(--accent-dark);
            border: none;
            border-radius: 60px;
            padding: 16px 28px;
            font-weight: 800;
            font-size: 1rem;
            color: white;
            width: 100%;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            min-height: 56px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            animation: fadeInUp 0.4s ease-out 0.35s backwards;
        }
        .btn-change::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s ease;
        }
        .btn-change:hover:not(:disabled)::before { left: 100%; }
        .btn-change:hover:not(:disabled) {
            background: var(--accent-dark-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(42,109,244,0.4);
        }
        .btn-change:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }
        .btn-change:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============================================================
           LINK VOLVER
           ============================================================ */
        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            margin-top: 16px;
            padding: 10px 18px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 40px;
            transition: all var(--transition-fast);
            width: 100%;
        }
        .back-link:hover {
            color: var(--accent-primary);
            background: var(--info-soft);
            transform: translateY(-1px);
        }
        .back-link i { font-size: 1rem; }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer-text {
            text-align: center;
            margin-top: 18px;
            font-size: 0.72rem;
            color: var(--text-light);
            letter-spacing: 0.02em;
            animation: fadeInUp 0.4s ease-out 0.4s backwards;
        }
        .footer-text i {
            color: var(--accent-primary);
            margin-right: 4px;
        }

        /* ============================================================
           MODALES
           ============================================================ */
        .modal-modern .modal-content {
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            background: var(--surface-glass-strong);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text-primary);
        }
        .modal-modern .modal-header {
            border-bottom: none;
            padding: 22px 28px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-modern .modal-header .modal-title {
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-modern .modal-body {
            padding: 18px 28px 24px;
            text-align: center;
        }
        .modal-modern .modal-footer {
            border-top: 1px solid var(--border-soft);
            padding: 16px 28px 22px;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .modal-modern .modal-footer .btn {
            border-radius: 60px;
            font-weight: 700;
            padding: 10px 24px;
            min-height: 44px;
        }

        .modal.fade .modal-dialog {
            transform: scale(0.92) translateY(20px);
            opacity: 0;
            transition: transform 0.35s var(--transition-bounce), opacity 0.3s ease;
        }
        .modal.show .modal-dialog {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        [data-theme="dark"] .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }
        .btn-close-white { filter: invert(1) grayscale(100%) brightness(200%); }
        [data-theme="dark"] .btn-close-white { filter: none; }

        .modal-header.header-success { background: linear-gradient(135deg, var(--success), var(--success-hover)); }
        .modal-header.header-error { background: linear-gradient(135deg, var(--danger), var(--danger-hover)); }
        .modal-header.header-warning { background: linear-gradient(135deg, var(--warning), #e6a030); }
        .modal-header.header-info { background: linear-gradient(135deg, var(--accent-primary), var(--accent-dark)); }

        .modal-header.header-success .modal-title,
        .modal-header.header-error .modal-title,
        .modal-header.header-info .modal-title { color: white; }
        .modal-header.header-warning .modal-title { color: #0b1e33; }

        .notification-icon {
            font-size: 3.5rem;
            text-align: center;
            display: block;
            margin: 8px 0 16px;
            animation: popIn 0.5s var(--transition-bounce);
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .notification-icon.success { color: var(--success); }
        .notification-icon.error { color: var(--danger); }
        .notification-icon.warning { color: var(--warning); }
        .notification-icon.info { color: var(--accent-primary); }

        /* ============================================================
           SPINNER OVERLAY
           ============================================================ */
        .spinner-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11,30,51,0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .spinner-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .spinner-box {
            background: var(--bg-secondary);
            padding: 40px 52px;
            border-radius: var(--radius-xl);
            text-align: center;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-subtle);
            animation: popIn 0.4s var(--transition-bounce);
            max-width: 90vw;
        }
        .spinner-box .spinner-border {
            width: 3rem;
            height: 3rem;
            color: var(--accent-primary);
            border-width: 3px;
        }
        .spinner-box h5 {
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 16px;
        }
        .spinner-box p {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 0;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            body {
                padding: 16px;
                padding-top: max(20px, env(safe-area-inset-top));
                align-items: flex-start;
            }
            body::before, body::after { display: none; }

            .theme-toggle {
                width: 44px;
                height: 44px;
                top: max(12px, env(safe-area-inset-top));
                right: max(12px, env(safe-area-inset-right));
                font-size: 1rem;
            }

            .password-container { max-width: 100%; }
            .password-card {
                padding: 28px 22px 24px;
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-md);
            }
            .password-title { font-size: 1.45rem; }
            .password-subtitle { font-size: 0.85rem; margin-bottom: 22px; }
            .pwd-field .form-control { font-size: 16px; height: 54px; }
            .btn-change { font-size: 0.95rem; min-height: 52px; padding: 14px 22px; }

            .modal-modern .modal-header { padding: 18px 20px 10px; }
            .modal-modern .modal-body { padding: 14px 20px 20px; }
            .modal-modern .modal-footer { padding: 12px 20px 18px; }
        }

        @media (max-width: 480px) {
            body { padding: 10px; padding-top: max(14px, env(safe-area-inset-top)); }

            .theme-toggle {
                top: max(10px, env(safe-area-inset-top));
                right: max(10px, env(safe-area-inset-right));
                width: 42px;
                height: 42px;
            }

            .password-card { padding: 22px 16px 20px; border-radius: 20px; }

            .icon-wrapper {
                width: 68px;
                height: 68px;
                border-radius: 20px;
                margin-bottom: 16px;
            }
            .icon-wrapper i { font-size: 2.1rem; }
            .icon-wrapper .pulse-ring { border-radius: 20px; }

            .password-title { font-size: 1.25rem; }
            .password-subtitle { font-size: 0.82rem; margin-bottom: 20px; }

            .pwd-field { margin-bottom: 16px; }
            .pwd-field .field-label { font-size: 0.8rem; margin-bottom: 8px; }
            .pwd-field .form-control {
                height: 52px;
                font-size: 16px;
                padding: 0 46px 0 44px;
                border-radius: 14px;
            }
            .pwd-field .form-control.no-toggle { padding-right: 16px; }
            .pwd-field .field-icon { left: 14px; font-size: 1rem; }
            .pwd-field .pwd-toggle { right: 6px; width: 38px; height: 38px; }

            .password-requirements { padding: 10px 12px; gap: 5px; }
            .password-requirements .req-item { font-size: 0.72rem; }

            .btn-change {
                padding: 14px 18px;
                font-size: 0.95rem;
                min-height: 52px;
                border-radius: 14px;
            }

            .back-link { font-size: 0.8rem; padding: 8px 14px; }
            .footer-text { font-size: 0.65rem; margin-top: 14px; }

            .spinner-box { padding: 30px 28px; }
        }

        /* Landscape en móvil */
        @media (max-height: 600px) and (orientation: landscape) {
            body { align-items: flex-start; padding: 10px; }
            .icon-wrapper { width: 60px; height: 60px; margin-bottom: 12px; }
            .icon-wrapper i { font-size: 1.8rem; }
            .password-card { padding: 20px 24px; }
            .password-title { font-size: 1.2rem; }
            .password-subtitle { margin-bottom: 16px; }
            .pwd-field { margin-bottom: 14px; }
        }

        /* Fix iOS backdrop-filter */
        @supports (-webkit-touch-callout: none) {
            .password-card {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: var(--surface-glass-strong);
            }
        }

        /* ============================================================
           ACCESIBILIDAD
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        :focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border-soft);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-light); }
    </style>
</head>
<body>

<!-- ============================================================ -->
<!-- THEME TOGGLE -->
<!-- ============================================================ -->
<button class="theme-toggle" id="themeToggle" type="button"
        aria-label="Cambiar tema" title="Cambiar tema claro/oscuro">
    <i class="bi bi-moon-stars" id="themeIcon"></i>
</button>

<div class="password-container">

    <!-- ============================================================ -->
    <!-- CARD PRINCIPAL -->
    <!-- ============================================================ -->
    <div class="password-card">

        <!-- Icono con anillo pulsante -->
        <div class="icon-wrapper">
            <span class="pulse-ring"></span>
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <!-- Título y subtítulo -->
        <h1 class="password-title">Cambiar Contraseña</h1>
        <div class="password-subtitle">
            Verifica tu identidad para continuar
            <br>
            <span class="highlight"><i class="bi bi-shield-check"></i> Seguro</span>
        </div>

        <!-- Contenedor para mensajes flash del backend -->
        <div id="messageContainer"></div>

        <!-- Formulario (submit tradicional) -->
        <form action="/auth/change-password-login" method="post" id="passwordForm" novalidate>

            <!-- Campo: Email -->
            <div class="pwd-field" id="fieldEmail">
                <label class="field-label" for="email">
                    <i class="bi bi-envelope-fill"></i>
                    Email <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <span class="field-icon" aria-hidden="true">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" name="email" id="email"
                           class="form-control no-toggle"
                           placeholder="tu@email.com"
                           required autocomplete="email"
                           maxlength="120"
                           aria-label="Email">
                </div>
            </div>

            <!-- Campo: Contraseña Actual -->
            <div class="pwd-field" id="fieldCurrent">
                <label class="field-label" for="currentPassword">
                    <i class="bi bi-lock-fill"></i>
                    Contraseña Actual <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <span class="field-icon" aria-hidden="true">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" name="current_password" id="currentPassword"
                           class="form-control"
                           placeholder="Tu contraseña actual"
                           required autocomplete="current-password"
                           maxlength="200"
                           aria-label="Contraseña actual">
                    <button type="button" class="pwd-toggle" data-target="currentPassword"
                            aria-label="Mostrar contraseña" title="Mostrar/ocultar">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Campo: Nueva Contraseña -->
            <div class="pwd-field" id="fieldNew">
                <label class="field-label" for="newPassword">
                    <i class="bi bi-shield-lock-fill"></i>
                    Nueva Contraseña <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <span class="field-icon" aria-hidden="true">
                        <i class="bi bi-shield-lock"></i>
                    </span>
                    <input type="password" name="new_password" id="newPassword"
                           class="form-control"
                           placeholder="Mínimo 8 caracteres"
                           required autocomplete="new-password"
                           maxlength="200"
                           aria-label="Nueva contraseña">
                    <button type="button" class="pwd-toggle" data-target="newPassword"
                            aria-label="Mostrar contraseña" title="Mostrar/ocultar">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>

                <!-- Medidor de fortaleza -->
                <div class="strength-meter">
                    <div class="strength-bar">
                        <div class="strength-bar-fill" id="strengthBarFill"></div>
                    </div>
                    <span class="strength-label" id="strengthLabel">—</span>
                </div>

                <!-- Requisitos -->
                <div class="password-requirements" id="requirements">
                    <span class="req-item" id="reqLength">
                        <i class="bi bi-circle"></i> Mínimo 8 caracteres
                    </span>
                    <span class="req-item" id="reqMatch">
                        <i class="bi bi-circle"></i> Coinciden ambas contraseñas
                    </span>
                </div>
            </div>

            <!-- Campo: Confirmar Nueva Contraseña -->
            <div class="pwd-field" id="fieldConfirm">
                <label class="field-label" for="confirmPassword">
                    <i class="bi bi-shield-check"></i>
                    Confirmar Nueva Contraseña <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <span class="field-icon" aria-hidden="true">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input type="password" name="confirm_password" id="confirmPassword"
                           class="form-control"
                           placeholder="Repite la contraseña"
                           required autocomplete="new-password"
                           maxlength="200"
                           aria-label="Confirmar nueva contraseña">
                    <button type="button" class="pwd-toggle" data-target="confirmPassword"
                            aria-label="Mostrar contraseña" title="Mostrar/ocultar">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Botón principal -->
            <button type="submit" class="btn-change" id="submitBtn">
                <i class="bi bi-check-circle-fill"></i>
                <span>Cambiar Contraseña</span>
            </button>
        </form>

        <!-- Link volver al login -->
        <a href="/auth/login" class="back-link">
            <i class="bi bi-arrow-left"></i> Volver al Login
        </a>

        <!-- Footer -->
        <div class="footer-text">
            <i class="bi bi-shield-check"></i> Lumen Legal v1.0
        </div>
    </div>

</div>

<!-- ============================================================ -->
<!-- MODAL DE NOTIFICACIÓN -->
<!-- ============================================================ -->
<div class="modal fade modal-modern" id="notificationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" id="notificationHeader">
                <h5 class="modal-title" id="notificationTitle">Notificación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="notificationBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- LOADING OVERLAY -->
<!-- ============================================================ -->
<div id="loadingOverlay" class="spinner-overlay" role="status" aria-live="polite">
    <div class="spinner-box">
        <div class="spinner-border" role="status"></div>
        <h5>Procesando...</h5>
        <p>Un momento, por favor.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
'use strict';

/* ============================================================
   UTILIDADES
   ============================================================ */
function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

/* ============================================================
   TEMA CLARO / OSCURO
   ============================================================ */
(function initTheme() {
    const saved = localStorage.getItem('lumen-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeIcon(theme);
})();

function updateThemeIcon(theme) {
    const icon = document.getElementById('themeIcon');
    if (!icon) return;
    icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars';
}

document.getElementById('themeToggle')?.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('lumen-theme', next);
    updateThemeIcon(next);
});

// Atajo de teclado "T"
document.addEventListener('keydown', (e) => {
    if (!e || typeof e.key !== 'string') return;
    if (e.key.toLowerCase() === 't' && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const tag = document.activeElement?.tagName;
        if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
            document.getElementById('themeToggle')?.click();
        }
    }
});

/* ============================================================
   MODAL NOTIFICACIÓN
   ============================================================ */
function showNotification(title, bodyHTML, type = 'info') {
    const modalEl = document.getElementById('notificationModal');
    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    const header = document.getElementById('notificationHeader');
    const titleEl = document.getElementById('notificationTitle');
    const bodyEl = document.getElementById('notificationBody');

    header.className = 'modal-header';
    let iconHTML = '';

    if (type === 'success') {
        header.classList.add('header-success');
        iconHTML = '<i class="bi bi-check-circle-fill notification-icon success"></i>';
    } else if (type === 'error') {
        header.classList.add('header-error');
        iconHTML = '<i class="bi bi-x-circle-fill notification-icon error"></i>';
    } else if (type === 'warning') {
        header.classList.add('header-warning');
        iconHTML = '<i class="bi bi-exclamation-triangle-fill notification-icon warning"></i>';
    } else {
        header.classList.add('header-info');
        iconHTML = '<i class="bi bi-info-circle-fill notification-icon info"></i>';
    }

    titleEl.textContent = title;
    bodyEl.innerHTML = iconHTML + bodyHTML;
    modal.show();
}

/* ============================================================
   MENSAJE EN LA PÁGINA (para errores flash del backend)
   ============================================================ */
function showMessage(message, type = 'info') {
    const container = document.getElementById('messageContainer');
    if (!container) return;

    const safeMessage = escapeHTML(message);

    let alertClass, icon;

    if (type === 'success') {
        alertClass = 'alert-success';
        icon = 'bi-check-circle-fill';
    } else if (type === 'error') {
        alertClass = 'alert-danger';
        icon = 'bi-exclamation-triangle-fill';
    } else if (type === 'warning') {
        alertClass = 'alert-warning';
        icon = 'bi-exclamation-circle-fill';
    } else {
        alertClass = 'alert-info';
        icon = 'bi-info-circle-fill';
    }

    container.innerHTML = `
        <div class="alert-custom ${alertClass}">
            <i class="bi ${icon}"></i>
            <span>${safeMessage}</span>
        </div>
    `;
}

/* ============================================================
   LOADING
   ============================================================ */
function showLoading() {
    document.getElementById('loadingOverlay').classList.add('active');
}
function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('active');
}

// Exponer globalmente
window.showNotification = showNotification;
window.showMessage = showMessage;
window.showLoading = showLoading;
window.hideLoading = hideLoading;

/* ============================================================
   TOGGLE MOSTRAR/OCULTAR CONTRASEÑA
   ============================================================ */
document.querySelectorAll('.pwd-toggle').forEach(btn => {
    btn.addEventListener('click', function () {
        const targetId = this.dataset.target;
        const input = document.getElementById(targetId);
        const icon = this.querySelector('i');
        if (!input || !icon) return;

        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        icon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        this.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
});

/* ============================================================
   MEDIDOR DE FORTALEZA + REQUISITOS
   ============================================================ */
const newPassInput = document.getElementById('newPassword');
const confirmPassInput = document.getElementById('confirmPassword');
const reqLength = document.getElementById('reqLength');
const reqMatch = document.getElementById('reqMatch');
const strengthBarFill = document.getElementById('strengthBarFill');
const strengthLabel = document.getElementById('strengthLabel');
const fieldNew = document.getElementById('fieldNew');
const fieldConfirm = document.getElementById('fieldConfirm');

function evaluarFortaleza(val) {
    return {
        length: val.length >= 8,
        upper: /[A-Z]/.test(val),
        lower: /[a-z]/.test(val),
        number: /[0-9]/.test(val),
        special: /[^A-Za-z0-9]/.test(val)
    };
}

function actualizarMedidor() {
    const val = newPassInput?.value || '';
    const checks = evaluarFortaleza(val);
    const metCount = [checks.length, checks.upper, checks.lower, checks.number, checks.special]
        .filter(Boolean).length;

    strengthBarFill?.classList.remove('weak', 'medium', 'strong');
    strengthLabel?.classList.remove('weak', 'medium', 'strong');

    if (val.length === 0) {
        if (strengthBarFill) strengthBarFill.style.width = '0%';
        if (strengthLabel) strengthLabel.textContent = '—';
    } else if (metCount <= 1) {
        strengthBarFill?.classList.add('weak');
        strengthLabel?.classList.add('weak');
        if (strengthLabel) strengthLabel.textContent = 'Débil';
    } else if (metCount <= 3) {
        strengthBarFill?.classList.add('medium');
        strengthLabel?.classList.add('medium');
        if (strengthLabel) strengthLabel.textContent = 'Media';
    } else {
        strengthBarFill?.classList.add('strong');
        strengthLabel?.classList.add('strong');
        if (strengthLabel) strengthLabel.textContent = 'Fuerte';
    }
}

function validateRequirements() {
    if (!newPassInput || !confirmPassInput) return;

    const newPass = newPassInput.value;
    const confirmPass = confirmPassInput.value;

    // Requisito: Longitud mínima
    if (newPass.length >= 8) {
        reqLength.className = 'req-item valid';
        reqLength.innerHTML = '<i class="bi bi-check-circle-fill"></i> Mínimo 8 caracteres';
    } else {
        reqLength.className = 'req-item invalid';
        reqLength.innerHTML = '<i class="bi bi-circle"></i> Mínimo 8 caracteres';
    }

    // Requisito: Coincidencia
    if (newPass.length > 0 && newPass === confirmPass) {
        reqMatch.className = 'req-item valid';
        reqMatch.innerHTML = '<i class="bi bi-check-circle-fill"></i> Coinciden ambas contraseñas';
        confirmPassInput.classList.remove('is-invalid');
        fieldConfirm?.classList.remove('has-error');
    } else if (confirmPass.length > 0) {
        reqMatch.className = 'req-item invalid';
        reqMatch.innerHTML = '<i class="bi bi-x-circle-fill"></i> Las contraseñas no coinciden';
    } else {
        reqMatch.className = 'req-item';
        reqMatch.innerHTML = '<i class="bi bi-circle"></i> Coinciden ambas contraseñas';
    }

    actualizarMedidor();
}

newPassInput?.addEventListener('input', function () {
    this.classList.remove('is-invalid');
    fieldNew?.classList.remove('has-error');
    validateRequirements();
});

confirmPassInput?.addEventListener('input', function () {
    this.classList.remove('is-invalid');
    fieldConfirm?.classList.remove('has-error');
    validateRequirements();
});

/* ============================================================
   ENTER EN CONFIRMAR → ENVÍA EL FORMULARIO
   ============================================================ */
confirmPassInput?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('submitBtn')?.click();
    }
});

/* ============================================================
   VALIDACIÓN ANTES DE ENVIAR (submit tradicional)
   ============================================================ */
document.getElementById('passwordForm')?.addEventListener('submit', function (e) {
    const newPass = newPassInput?.value || '';
    const confirmPass = confirmPassInput?.value || '';
    const currentPass = document.getElementById('currentPassword')?.value || '';
    const emailVal = document.getElementById('email')?.value || '';

    // Validar email
    if (!emailVal || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
        e.preventDefault();
        showMessage('Por favor ingresa un email válido.', 'warning');
        document.getElementById('email')?.focus();
        return;
    }

    // Validar contraseña actual
    if (!currentPass) {
        e.preventDefault();
        showMessage('Debes ingresar tu contraseña actual.', 'warning');
        document.getElementById('currentPassword')?.focus();
        return;
    }

    // Validar longitud mínima
    if (newPass.length < 8) {
        e.preventDefault();
        showMessage('La nueva contraseña debe tener al menos 8 caracteres.', 'warning');
        newPassInput?.classList.add('is-invalid');
        fieldNew?.classList.add('has-error');
        newPassInput?.focus();
        return;
    }

    // Validar coincidencia
    if (newPass !== confirmPass) {
        e.preventDefault();
        showMessage('Las contraseñas no coinciden. Por favor, verifica.', 'warning');
        confirmPassInput?.classList.add('is-invalid');
        fieldConfirm?.classList.add('has-error');
        confirmPassInput?.focus();
        return;
    }

    // Validar que no sea igual a la actual
    if (newPass === currentPass) {
        e.preventDefault();
        showMessage('La nueva contraseña no puede ser igual a la actual.', 'warning');
        newPassInput?.classList.add('is-invalid');
        fieldNew?.classList.add('has-error');
        newPassInput?.focus();
        return;
    }

    // Todo OK → Bloquear botón y mostrar loading
    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
        const originalHTML = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="btn-spinner"></span> <span>Cambiando...</span>';
    }

    showLoading();
});

/* ============================================================
   PROCESAR MENSAJES FLASH DE LA URL
   ============================================================ */
document.addEventListener('DOMContentLoaded', function () {
    // Autofocus en email (desktop)
    if (window.innerWidth > 768) {
        setTimeout(() => document.getElementById('email')?.focus(), 400);
    }

    // Verificar parámetros de URL para mensajes flash
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    const success = params.get('success');
    const warning = params.get('warning');
    const info = params.get('info');

    if (error) {
        showMessage(decodeURIComponent(error), 'error');
    } else if (success) {
        showMessage(decodeURIComponent(success), 'success');
    } else if (warning) {
        showMessage(decodeURIComponent(warning), 'warning');
    } else if (info) {
        showMessage(decodeURIComponent(info), 'info');
    }

    // Inicializar medidor
    validateRequirements();
});

/* ============================================================
   PAGESHOW: Si el navegador vuelve con "atrás", restaurar botón
   ============================================================ */
window.addEventListener('pageshow', function () {
    hideLoading();
    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn && submitBtn.disabled) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-check-circle-fill"></i> <span>Cambiar Contraseña</span>';
    }
});
</script>
</body>
</html>
