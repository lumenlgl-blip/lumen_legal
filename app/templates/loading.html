<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Legal · Iniciando</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b1e33 0%, #1a3b6b 50%, #2a6df4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .loader-container {
            text-align: center;
            animation: fadeIn 1.2s ease;
            z-index: 10;
        }

        .loader-logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
            background: white;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: pulseLogo 2s infinite ease-in-out;
            overflow: hidden;
        }

        .loader-logo img {
            width: 75px;
            height: auto;
        }

        .loader-logo .fallback-icon {
            font-size: 45px;
        }

        .loader-title {
            color: white;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .loader-subtitle {
            color: rgba(255,255,255,0.65);
            font-size: 1rem;
            font-weight: 300;
            margin-bottom: 24px;
        }

        .loader-bar {
            width: 280px;
            height: 4px;
            background: rgba(255,255,255,0.12);
            border-radius: 4px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5b342, #ffd700);
            border-radius: 4px;
            animation: loadProgress 6s ease-in-out forwards;
            box-shadow: 0 0 12px rgba(245,179,66,0.6);
        }

        .loader-status {
            color: rgba(255,255,255,0.45);
            font-size: 0.75rem;
            margin-top: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 400;
        }

        .loader-dots {
            display: inline-block;
            min-width: 24px;
            text-align: left;
        }

        /* Animaciones */
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
            50% { transform: scale(1.04); box-shadow: 0 24px 80px rgba(42,109,244,0.5); }
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            15% { width: 10%; }
            35% { width: 30%; }
            55% { width: 50%; }
            75% { width: 72%; }
            100% { width: 100%; }
        }

        /* Partículas de fondo */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.12);
            border-radius: 50%;
            animation: float 12s infinite linear;
            z-index: 1;
        }

        .particle:nth-child(1) { left: 8%; animation-duration: 14s; }
        .particle:nth-child(2) { left: 18%; animation-duration: 18s; animation-delay: 2s; }
        .particle:nth-child(3) { left: 28%; animation-duration: 16s; animation-delay: 4s; }
        .particle:nth-child(4) { left: 45%; animation-duration: 20s; animation-delay: 1s; }
        .particle:nth-child(5) { left: 62%; animation-duration: 15s; animation-delay: 3s; }
        .particle:nth-child(6) { left: 75%; animation-duration: 17s; animation-delay: 5s; }
        .particle:nth-child(7) { left: 88%; animation-duration: 13s; animation-delay: 2s; }
        .particle:nth-child(8) { left: 35%; animation-duration: 19s; animation-delay: 6s; }
        .particle:nth-child(9) { left: 55%; animation-duration: 16s; animation-delay: 4s; }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .loader-logo { width: 85px; height: 85px; border-radius: 22px; }
            .loader-logo img { width: 55px; }
            .loader-logo .fallback-icon { font-size: 35px; }
            .loader-title { font-size: 1.6rem; }
            .loader-subtitle { font-size: 0.85rem; }
            .loader-bar { width: 210px; }
            .loader-status { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <!-- Partículas decorativas -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="loader-container">
        <!-- Logo con fallback -->
        <div class="loader-logo">
            <img src="/static/img/logo.jpeg" alt="Lumen Legal" 
                 onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=fallback-icon>⚖️</span>';">
        </div>

        <h1 class="loader-title">Lumen Legal</h1>
        <p class="loader-subtitle">Sistema de Gestión Jurídica</p>

        <div class="loader-bar">
            <div class="loader-bar-fill"></div>
        </div>

        <p class="loader-status">
            Iniciando sistema<span class="loader-dots">...</span>
        </p>
    </div>

    <!-- Redirección automática con verificación de sesión -->
    <script>
        const dots = document.querySelector('.loader-dots');
        const dotStates = ['', '.', '..', '...'];
        let dotIndex = 0;

        // Animación de puntos
        setInterval(() => {
            dotIndex = (dotIndex + 1) % dotStates.length;
            dots.textContent = dotStates[dotIndex];
        }, 400);

        // Redirección después de 6 segundos
        setTimeout(() => {
            fetch('/auth/check-session')
                .then(r => r.json())
                .then(data => {
                    if (data.authenticated) {
                        window.location.href = '/';
                    } else {
                        window.location.href = '/auth/login';
                    }
                })
                .catch(() => {
                    window.location.href = '/auth/login';
                });
        }, 6000);

        // Si el usuario hace clic, redirigir inmediatamente
        document.body.addEventListener('click', () => {
            fetch('/auth/check-session')
                .then(r => r.json())
                .then(data => {
                    if (data.authenticated) {
                        window.location.href = '/';
                    } else {
                        window.location.href = '/auth/login';
                    }
                })
                .catch(() => {
                    window.location.href = '/auth/login';
                });
        });
    </script>
</body>
</html>
