<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lumen Legal · Iniciando</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b1e33 0%, #1a3b6b 50%, #2a6df4 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        .loader-container {
            text-align: center;
            animation: fadeIn 1.2s ease;
        }

        .loader-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            background: white;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: pulseLogo 2s infinite ease-in-out;
        }

        .loader-logo img {
            width: 70px;
            height: auto;
        }

        .loader-title {
            color: white;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .loader-subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 24px;
        }

        .loader-bar {
            width: 260px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5b342, #ffd700);
            border-radius: 4px;
            animation: loadProgress 8s ease-in-out infinite;
        }

        .loader-status {
            color: rgba(255,255,255,0.4);
            font-size: 0.75rem;
            margin-top: 12px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .loader-dots {
            display: inline-block;
            animation: dots 1.6s steps(4, end) infinite;
        }

        /* Animaciones */
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
            50% { transform: scale(1.03); box-shadow: 0 24px 80px rgba(42,109,244,0.4); }
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            20% { width: 15%; }
            40% { width: 35%; }
            60% { width: 55%; }
            80% { width: 78%; }
            100% { width: 100%; }
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        /* Partículas de fondo (opcional) */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: float 12s infinite linear;
        }

        .particle:nth-child(1) { left: 10%; animation-duration: 14s; }
        .particle:nth-child(2) { left: 20%; animation-duration: 18s; animation-delay: 2s; }
        .particle:nth-child(3) { left: 30%; animation-duration: 16s; animation-delay: 4s; }
        .particle:nth-child(4) { left: 50%; animation-duration: 20s; animation-delay: 1s; }
        .particle:nth-child(5) { left: 70%; animation-duration: 15s; animation-delay: 3s; }
        .particle:nth-child(6) { left: 80%; animation-duration: 17s; animation-delay: 5s; }
        .particle:nth-child(7) { left: 90%; animation-duration: 13s; animation-delay: 2s; }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .loader-logo { width: 80px; height: 80px; }
            .loader-logo img { width: 50px; }
            .loader-title { font-size: 1.6rem; }
            .loader-bar { width: 200px; }
        }
    </style>
</head>
<body>

    <!-- Partículas decorativas -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="loader-container">
        <!-- Logo (si tienes, usa /static/img/logo.jpeg) -->
        <div class="loader-logo">
            <img src="/static/img/logo.jpeg" alt="Lumen Legal" onerror="this.style.display='none'; this.parentElement.innerHTML='⚖️'; this.parentElement.style.fontSize='40px';">
        </div>

        <h1 class="loader-title">Lumen Legal</h1>
        <p class="loader-subtitle">Sistema de Gestión Jurídica</p>

        <div class="loader-bar">
            <div class="loader-bar-fill"></div>
        </div>

        <p class="loader-status">
            Iniciando sistema<span class="loader-dots">...</span>
        </p>
    </div>

    <!-- Redirección automática después de 8 segundos -->
    <script>
        setTimeout(() => {
            window.location.href = '/';
        }, 8000);
    </script>
</body>
</html>
