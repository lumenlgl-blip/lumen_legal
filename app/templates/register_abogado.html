<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Abogado · Lumen Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f2f5fb;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f8fafc;
            --surface-glass: rgba(255,255,255,0.82);
            --surface-glass-strong: rgba(255,255,255,0.95);
            --border-subtle: rgba(255,255,255,0.5);
            --border-soft: #e9edf4;
            --text-primary: #0b1e33;
            --text-secondary: #4a5b6e;
            --text-muted: #6b7b8f;
            --text-light: #8a9bb0;
            --accent-primary: #2a6df4;
            --accent-primary-hover: #1a5ad4;
            --accent-dark: #0b1e33;
            --accent-dark-hover: #1a3b6b;
            --success: #1a8b5c;
            --success-hover: #0e6b46;
            --success-soft: #d1fae5;
            --warning: #f5b342;
            --warning-hover: #e6a030;
            --warning-soft: #fdf3e0;
            --danger: #dc3545;
            --danger-hover: #b02a37;
            --danger-soft: #fee9e7;
            --info: #1f6f9e;
            --info-soft: #e3effa;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 48px -12px rgba(0,20,40,0.12);
            --shadow-xl: 0 40px 80px -20px rgba(0,0,0,0.2);
            --radius-md: 16px;
            --radius-xl: 28px;
            --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        [data-theme="dark"] {
            --bg-primary: #0a1523;
            --bg-secondary: #111d2e;
            --bg-tertiary: #16243a;
            --surface-glass: rgba(22,36,58,0.85);
            --surface-glass-strong: rgba(22,36,58,0.95);
            --border-subtle: rgba(255,255,255,0.08);
            --border-soft: #223147;
            --text-primary: #e8eef7;
            --text-secondary: #b8c5d6;
            --text-muted: #8a9bb0;
            --text-light: #6b7b8f;
            --accent-primary: #5b93ff;
            --accent-primary-hover: #7aa9ff;
            --accent-dark: #5b93ff;
            --accent-dark-hover: #7aa9ff;
            --success: #34d399;
            --success-hover: #10b981;
            --success-soft: rgba(52,211,153,0.15);
            --warning: #fbbf24;
            --warning-hover: #f59e0b;
            --warning-soft: rgba(251,191,36,0.15);
            --danger: #f87171;
            --danger-hover: #ef4444;
            --danger-soft: rgba(248,113,113,0.15);
            --info: #60a5fa;
            --info-soft: rgba(96,165,250,0.15);
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: var(--bg-primary);
            background-image:
                radial-gradient(at 0% 0%, rgba(42,109,244,0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(26,139,92,0.06) 0px, transparent 50%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px 0;
            color: var(--text-primary);
            transition: background-color var(--transition-normal), color var(--transition-normal);
        }
        .theme-toggle {
            position: fixed; top: 24px; right: 24px; z-index: 1050;
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--surface-glass-strong);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.2rem; box-shadow: var(--shadow-md);
            cursor: pointer; transition: all var(--transition-normal);
        }
        .theme-toggle:hover {
            transform: translateY(-2px) rotate(15deg);
            color: var(--accent-primary);
            box-shadow: var(--shadow-lg);
        }
        .btn-menu {
            position: fixed; top: 24px; left: 24px; z-index: 1050;
            background: var(--surface-glass-strong); backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle); border-radius: 60px;
            padding: 12px 24px; font-weight: 600; color: var(--text-primary);
            text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
            box-shadow: var(--shadow-md);
            transition: all var(--transition-normal);
        }
        .btn-menu:hover { transform: translateY(-2px); color: var(--accent-primary); }

        .register-container { width: 100%; max-width: 720px; padding: 0 16px; }
        .card-glass {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            border-radius: var(--radius-xl);
            padding: 36px 32px 32px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-subtle);
        }
        .page-header { text-align: center; margin-bottom: 24px; }
        .icon-wrapper {
            width: 72px; height: 72px; border-radius: 24px;
            background: linear-gradient(135deg, rgba(42,109,244,0.1), rgba(42,109,244,0.03));
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
        }
        .icon-wrapper i { font-size: 2.4rem; color: var(--accent-primary); }
        h1 { font-weight: 800; font-size: 1.8rem; color: var(--text-primary); letter-spacing: -0.02em; margin: 0; }
        .subtitle { color: var(--text-muted); font-weight: 500; font-size: 0.9rem; }

        .form-field { margin-bottom: 18px; }
        .form-field label {
            display: block; font-weight: 700; font-size: 0.82rem;
            color: var(--text-secondary); margin-bottom: 6px;
        }
        .form-field .form-control {
            width: 100%; height: 54px; border-radius: var(--radius-md);
            border: 1.5px solid var(--border-soft);
            padding: 0 18px; font-size: 0.95rem;
            background: var(--bg-secondary); color: var(--text-primary);
            transition: all 0.2s;
        }
        .form-field .form-control:focus {
            outline: none; border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(42,109,244,0.12);
        }
        .form-field .form-control.is-invalid {
            border-color: var(--danger);
        }
        .form-field .required { color: var(--danger); }
        .form-field .hint {
            font-size: 0.72rem; color: var(--text-muted);
            margin-top: 4px; display: flex; align-items: center; gap: 4px;
        }

        .btn-submit {
            background: var(--accent-dark); border: none;
            border-radius: 60px; padding: 14px 24px;
            font-weight: 700; font-size: 1rem; color: white;
            width: 100%; transition: all 0.25s;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-top: 10px;
        }
        .btn-submit:hover:not(:disabled) {
            background: var(--accent-dark-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        .btn-back {
            border-radius: 40px; padding: 8px 20px;
            font-weight: 600; font-size: 0.85rem;
            border: 1px solid var(--border-soft);
            color: var(--text-secondary); background: transparent;
            transition: all 0.2s; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 16px;
        }
        .btn-back:hover { background: var(--bg-secondary); color: var(--text-primary); }

        /* ── MODALES MODERNOS ── */
        .modal-modern .modal-content {
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            background: var(--surface-glass-strong);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
        }
        .modal-modern .modal-header {
            border-bottom: none;
            padding: 22px 28px 12px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-modern .modal-header .modal-title {
            font-weight: 800; font-size: 1.1rem;
            display: flex; align-items: center; gap: 10px;
        }
        .modal-modern .modal-body { padding: 18px 28px 24px; }
        .modal-modern .modal-footer {
            border-top: 1px solid var(--border-soft);
            padding: 16px 28px 22px;
            gap: 10px; flex-wrap: wrap;
        }
        .modal-modern .modal-footer .btn {
            border-radius: 60px; font-weight: 600;
            padding: 10px 24px; min-height: 44px;
        }
        .modal.fade .modal-dialog {
            transform: scale(0.92) translateY(20px); opacity: 0;
            transition: transform 0.35s var(--transition-bounce), opacity 0.3s ease;
        }
        .modal.show .modal-dialog { transform: scale(1) translateY(0); opacity: 1; }

        [data-theme="dark"] .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }
        .btn-close-white { filter: invert(1) grayscale(100%) brightness(200%); }
        [data-theme="dark"] .btn-close-white { filter: none; }

        .modal-header.header-success { background: linear-gradient(135deg, var(--success), var(--success-hover)); }
        .modal-header.header-error   { background: linear-gradient(135deg, var(--danger), var(--danger-hover)); }
        .modal-header.header-warning { background: linear-gradient(135deg, var(--warning), var(--warning-hover)); }
        .modal-header.header-info    { background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-hover)); }
        .modal-header.header-success .modal-title,
        .modal-header.header-error .modal-title,
        .modal-header.header-warning .modal-title,
        .modal-header.header-info .modal-title { color: white; }

        .notification-icon {
            font-size: 3.5rem; text-align: center;
            display: block; margin: 8px 0 16px;
            animation: popIn 0.5s var(--transition-bounce);
        }
        .notification-icon.success { color: var(--success); }
        .notification-icon.error   { color: var(--danger); }
        .notification-icon.warning { color: var(--warning); }
        .notification-icon.info    { color: var(--accent-primary); }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        /* ── LOADING OVERLAY ── */
        .spinner-overlay {
            position: fixed; inset: 0;
            background: rgba(11,30,51,0.5);
            backdrop-filter: blur(12px);
            z-index: 9999; display: none;
            align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .spinner-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .spinner-box {
            background: var(--bg-secondary);
            padding: 40px 52px;
            border-radius: var(--radius-xl);
            text-align: center;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-subtle);
            animation: popIn 0.4s var(--transition-bounce);
            max-width: 90vw;
        }
        .spinner-box .spinner-border {
            width: 3rem; height: 3rem;
            color: var(--accent-primary); border-width: 3px;
        }
        .spinner-box h5 { font-weight: 800; color: var(--text-primary); margin-top: 16px; }
        .spinner-box p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 0; }

        .btn-spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .card-glass { padding: 24px 20px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<!-- THEME TOGGLE -->
<button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema" title="Cambiar tema">
    <i class="bi bi-moon-stars" id="themeIcon"></i>
</button>

<a href="/api/abogados/" class="btn-menu"><i class="bi bi-arrow-left"></i> Volver</a>

<div class="register-container">
    <div class="card-glass">
        <div class="page-header">
            <div class="icon-wrapper"><i class="bi bi-person-plus"></i></div>
            <h1>Registrar Abogado</h1>
            <div class="subtitle">Datos profesionales para asignación en contratos</div>
        </div>

        <form id="abogadoForm" novalidate>
            <div class="form-field">
                <label for="nombre_completo">Nombre completo <span class="required">*</span></label>
                <input type="text" name="nombre_completo" id="nombre_completo" class="form-control"
                       placeholder="Ej: Juan Pérez López" maxlength="200" required autocomplete="off">
            </div>

            <div class="form-field">
                <label for="cedula_profesional">Cédula profesional <span class="required">*</span></label>
                <input type="text" name="cedula_profesional" id="cedula_profesional" class="form-control"
                       placeholder="Ej: 12345678" maxlength="50" required autocomplete="off">
                <div class="hint"><i class="bi bi-info-circle"></i> Aparecerá impresa en los contratos de servicios.</div>
            </div>

            <div class="form-field">
                <label for="domicilio_profesional">Domicilio profesional <span class="required">*</span></label>
                <input type="text" name="domicilio_profesional" id="domicilio_profesional" class="form-control"
                       placeholder="Ej: Av. Álvaro Obregón 123, Culiacán, Sinaloa"
                       maxlength="300" required autocomplete="off">
                <div class="hint"><i class="bi bi-info-circle"></i> Aparecerá en los contratos como domicilio para efectos legales.</div>
            </div>

            <div class="form-field">
                <label for="especialidad">Especialidad</label>
                <input type="text" name="especialidad" id="especialidad" class="form-control"
                       placeholder="Ej: Derecho Familiar, Civil, Penal..." maxlength="150" autocomplete="off">
            </div>

            <div class="form-field">
                <label for="telefono">Teléfono</label>
                <input type="tel" name="telefono" id="telefono" class="form-control"
                       placeholder="Ej: 6671234567" maxlength="20" autocomplete="off">
            </div>

            <div class="form-field" style="margin-bottom:20px;">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" class="form-control"
                       placeholder="Ej: abogado@lumenlegal.com" maxlength="120" autocomplete="off">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="bi bi-check2-circle"></i> <span>Registrar Abogado</span>
            </button>

            <div style="text-align:center;">
                <a href="/api/abogados/" class="btn-back">
                    <i class="bi bi-arrow-left"></i> Volver a la lista
                </a>
            </div>
        </form>
    </div>
</div>

<!-- ================================================== -->
<!-- MODAL NOTIFICACIÓN -->
<!-- ================================================== -->
<div class="modal fade modal-modern" id="notificationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" id="notificationHeader">
                <h5 class="modal-title" id="notificationTitle">Notificación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="notificationBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL CONFIRMACIÓN -->
<div class="modal fade modal-modern" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" style="background:linear-gradient(135deg,var(--warning),var(--warning-hover));">
                <h5 class="modal-title" style="color:#0b1e33;">
                    <i class="bi bi-exclamation-triangle"></i> Confirmación
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="confirmBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" id="confirmBtn">
                    <i class="bi bi-check2"></i> Confirmar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- LOADING OVERLAY -->
<div id="loadingOverlay" class="spinner-overlay" role="status" aria-live="polite">
    <div class="spinner-box">
        <div class="spinner-border" role="status"></div>
        <h5 id="loadingTitle">Registrando abogado...</h5>
        <p id="loadingText">Por favor espera.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
'use strict';

/* ============================================================
   TEMA CLARO / OSCURO
   ============================================================ */
(function initTheme() {
    const saved = localStorage.getItem('lumen-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeIcon(theme);
})();

function updateThemeIcon(theme) {
    const icon = document.getElementById('themeIcon');
    if (!icon) return;
    icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars';
}

document.getElementById('themeToggle')?.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('lumen-theme', next);
    updateThemeIcon(next);
});

/* Atajo "T" */
document.addEventListener('keydown', (e) => {
    if (!e || typeof e.key !== 'string') return;
    if (e.key.toLowerCase() === 't' && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const tag = document.activeElement?.tagName;
        if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
            document.getElementById('themeToggle')?.click();
        }
    }
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal.show').forEach(m => {
            const inst = bootstrap.Modal.getInstance(m);
            if (inst) inst.hide();
        });
    }
});

/* ============================================================
   UTILIDADES
   ============================================================ */
function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

/* ============================================================
   LOADING
   ============================================================ */
function showLoading(title = 'Procesando...', text = 'Por favor espera.') {
    document.getElementById('loadingTitle').textContent = title;
    document.getElementById('loadingText').textContent = text;
    document.getElementById('loadingOverlay').classList.add('active');
}
function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('active');
}

/* ============================================================
   MODAL NOTIFICACIÓN
   ============================================================ */
function showNotification(title, bodyHTML, type = 'info') {
    const modalEl = document.getElementById('notificationModal');
    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    const header = document.getElementById('notificationHeader');
    const titleEl = document.getElementById('notificationTitle');
    const bodyEl = document.getElementById('notificationBody');

    header.className = 'modal-header';
    let iconHTML = '';

    if (type === 'success') {
        header.classList.add('header-success');
        iconHTML = '<i class="bi bi-check-circle-fill notification-icon success"></i>';
    } else if (type === 'error') {
        header.classList.add('header-error');
        iconHTML = '<i class="bi bi-x-circle-fill notification-icon error"></i>';
    } else if (type === 'warning') {
        header.classList.add('header-warning');
        iconHTML = '<i class="bi bi-exclamation-triangle-fill notification-icon warning"></i>';
    } else {
        header.classList.add('header-info');
        iconHTML = '<i class="bi bi-info-circle-fill notification-icon info"></i>';
    }

    titleEl.textContent = title;
    bodyEl.innerHTML = iconHTML + bodyHTML;
    modal.show();
}

/* ============================================================
   MODAL CONFIRMACIÓN
   ============================================================ */
function showConfirm(title, bodyHTML, onConfirm) {
    const modalEl = document.getElementById('confirmModal');
    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    document.getElementById('confirmBody').innerHTML =
        `<h6 class="fw-bold mb-2" style="color:var(--text-primary);">${escapeHTML(title)}</h6>${bodyHTML}`;

    const confirmBtn = document.getElementById('confirmBtn');
    const newBtn = confirmBtn.cloneNode(true);
    confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);
    newBtn.addEventListener('click', function () {
        modal.hide();
        setTimeout(() => onConfirm(), 200);
    });
    modal.show();
}

/* ============================================================
   SUBMIT
   ============================================================ */
document.getElementById('abogadoForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    // ── Limpiar marcas previas ──
    document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));

    // ── Capturar valores ──
    const nombre    = document.getElementById('nombre_completo').value.trim();
    const cedula    = document.getElementById('cedula_profesional').value.trim();
    const domicilio = document.getElementById('domicilio_profesional').value.trim();
    const especialidad = document.getElementById('especialidad').value.trim();
    const telefono  = document.getElementById('telefono').value.trim();
    const email     = document.getElementById('email').value.trim();

    // ── Validar ──
    let valid = true;
    if (!nombre)    { document.getElementById('nombre_completo').classList.add('is-invalid'); valid = false; }
    if (!cedula)    { document.getElementById('cedula_profesional').classList.add('is-invalid'); valid = false; }
    if (!domicilio) { document.getElementById('domicilio_profesional').classList.add('is-invalid'); valid = false; }

    if (!valid) {
        showNotification('Campos incompletos',
            '<p>Nombre, cédula y domicilio profesional son <strong>obligatorios</strong>.</p>',
            'warning');
        const firstInvalid = document.querySelector('.is-invalid');
        if (firstInvalid) {
            firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => firstInvalid.focus?.(), 300);
        }
        return;
    }

    // ── Confirmación ──
    showConfirm('Registrar Abogado',
        `<p>¿Confirmas el registro del abogado?</p>
         <div class="alert alert-info mt-2 mb-0 small" style="border-radius:12px;">
            <div class="d-flex justify-content-between mb-1">
                <span class="text-muted">Nombre:</span>
                <strong>${escapeHTML(nombre)}</strong>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted">Cédula:</span>
                <strong>${escapeHTML(cedula)}</strong>
            </div>
         </div>`,
        async function () {
            // ── Envío ──
            const submitBtn = document.getElementById('submitBtn');
            const originalHTML = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="btn-spinner"></span> <span>Registrando...</span>';

            showLoading('Registrando abogado...', 'Guardando datos en el servidor.');

            const fd = new FormData();
            fd.append('nombre_completo', nombre);
            fd.append('cedula_profesional', cedula);
            fd.append('domicilio_profesional', domicilio);
            fd.append('especialidad', especialidad);
            fd.append('telefono', telefono);
            fd.append('email', email);

            try {
                const res = await fetch('/api/abogados/create', { method: 'POST', body: fd });

                hideLoading();

                if (!res.ok) {
                    let errMsg = 'Error al registrar el abogado.';
                    try {
                        const err = await res.json();
                        if (err.detail) errMsg = err.detail;
                    } catch (_) {}

                    showNotification('Error al registrar',
                        `<p>${escapeHTML(errMsg)}</p>`, 'error');

                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalHTML;
                    return;
                }

                showNotification('¡Abogado Registrado!',
                    `<div class="d-flex flex-column gap-2">
                        <div class="d-flex justify-content-between border-bottom pb-2">
                            <span class="text-muted">Nombre:</span>
                            <strong>${escapeHTML(nombre)}</strong>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-muted">Cédula:</span>
                            <strong>${escapeHTML(cedula)}</strong>
                        </div>
                        <p class="text-muted small mb-0 mt-2">
                            <i class="bi bi-check-circle me-1"></i>
                            Ya está disponible para asignarse en contratos.
                        </p>
                    </div>`,
                    'success');

                // Redirige tras cerrar el modal
                setTimeout(() => {
                    window.location.href = '/api/abogados/';
                }, 2500);

            } catch (err) {
                hideLoading();
                showNotification('Error',
                    `<p>${escapeHTML(err.message || 'Error desconocido')}</p>`, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalHTML;
            }
        }
    );
});
</script>
</body>
</html>
