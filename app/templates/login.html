<!DOCTYPE html>
<html>
<head>
    <title>Login - Lumen Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            background: white;
        }
        .logo { text-align: center; margin-bottom: 15px; }
        .logo img { max-height: 150px; width: auto; }
        h1 { color: #1a3c6e; font-size: 1.8rem; }
        .btn-menu { position: fixed; top: 20px; left: 20px; z-index: 1000; }
    </style>
</head>
<body>



<div class="container">
    <div class="login-card">
        <div class="logo text-center">
            <img src="/static/img/logo.jpeg" alt="Lumen Legal" style="max-height: 150px; width: auto;">
        </div>
        <h1 class="text-center mb-2">Lumen Legal</h1>
        <p class="text-center text-muted mb-4">Sistema de Gestión Jurídica</p>
        
        <!-- Mensaje de error (se reemplaza dinámicamente) -->
        <!-- ERROR_MESSAGE -->
        
        <form action="/auth/login" method="post" class="mt-3">
            <div class="mb-3">
                <label class="form-label"><strong>Email o Nombre de Usuario</strong></label>
                <input type="text" name="email" id="loginIdentifier" class="form-control form-control-lg" 
                       placeholder="admin@lumenlegal.com o Administrador" required autocomplete="off">
            </div>
            <div class="mb-3">
                <label class="form-label"><strong>Contraseña</strong></label>
                <input type="password" name="password" class="form-control form-control-lg" 
                       placeholder="********" required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Ingresar</button>
        </form>
        
        <hr>
        <p class="text-center text-muted small">Sistema Lumen Legal v1.0</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>




<!-- Modal para cambio de contraseña -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title">🔑 Cambio de Contraseña Obligatorio</h5>
            </div>
            <div class="modal-body">
                <p>Es tu <strong>primer acceso</strong>. Debes cambiar tu contraseña temporal por una nueva.</p>
                <div class="mb-3">
                    <label class="form-label"><strong>Nueva Contraseña *</strong></label>
                    <input type="password" id="newPassword" class="form-control form-control-lg" placeholder="Mínimo 6 caracteres" autocomplete="off">
                </div>
                <div class="mb-3">
                    <label class="form-label"><strong>Confirmar Contraseña *</strong></label>
                    <input type="password" id="confirmPassword" class="form-control form-control-lg" placeholder="Repite la contraseña" autocomplete="off">
                </div>
                <div id="passwordError" class="text-danger mt-2" style="display:none;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveNewPasswordBtn" class="btn btn-warning btn-lg w-100">💾 Guardar Nueva Contraseña</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Verificar si debe cambiar contraseña al cargar
document.addEventListener('DOMContentLoaded', function() {
    fetch('/auth/check-password-change')
        .then(res => res.json())
        .then(data => {
            if (data.must_change) {
                new bootstrap.Modal(document.getElementById('changePasswordModal')).show();
            }
        })
        .catch(() => {});
});

document.getElementById('saveNewPasswordBtn').addEventListener('click', async () => {
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const errorEl = document.getElementById('passwordError');
    
    if (!newPass || newPass.length < 6) {
        errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres';
        errorEl.style.display = 'block';
        return;
    }
    
    if (newPass !== confirmPass) {
        errorEl.textContent = 'Las contraseñas no coinciden';
        errorEl.style.display = 'block';
        return;
    }
    
    const formData = new FormData();
    formData.append('new_password', newPass);
    
    try {
        const response = await fetch('/auth/change-password', {
            method: 'POST',
            body: formData
        });
        
        if (!response.ok) {
            const error = await response.json();
            errorEl.textContent = error.detail || 'Error al cambiar contraseña';
            errorEl.style.display = 'block';
            return;
        }
        
        bootstrap.Modal.getInstance(document.getElementById('changePasswordModal')).hide();
        window.location.reload();
        
    } catch (error) {
        errorEl.textContent = 'Error de conexión';
        errorEl.style.display = 'block';
    }
});
</script>
</body>
</html>
