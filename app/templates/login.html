<!DOCTYPE html>
<html lang="es">
<head>
    <title>Lumen Legal · Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f2f5fb;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -40%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(42,109,244,0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(42,109,244,0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }

        .login-card {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 36px 32px 32px;
            box-shadow: 0 24px 56px -16px rgba(0,20,40,0.16);
            border: 1px solid rgba(255,255,255,0.5);
            transition: box-shadow 0.2s;
        }
        .login-card:hover {
            box-shadow: 0 32px 72px -20px rgba(0,20,40,0.2);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 8px;
        }
        .logo-area img {
            max-height: 120px;
            width: auto;
            border-radius: 16px;
        }

        .login-title {
            font-weight: 700;
            font-size: 1.8rem;
            color: #0b1e33;
            text-align: center;
            letter-spacing: -0.02em;
            margin-bottom: 0;
        }
        .login-title i {
            color: #2a6df4;
            margin-right: 6px;
        }
        .login-subtitle {
            text-align: center;
            color: #6b7b8f;
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .login-subtitle span {
            background: #eef3fa;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #2a4a7a;
        }

        .form-floating-custom {
            position: relative;
            margin-bottom: 16px;
        }
        .form-floating-custom .form-control {
            border-radius: 16px;
            border: 1.5px solid #e9edf4;
            padding: 14px 18px 14px 46px;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.6);
            transition: all 0.2s;
            height: 56px;
        }
        .form-floating-custom .form-control:focus {
            border-color: #2a6df4;
            box-shadow: 0 0 0 4px rgba(42,109,244,0.08);
            background: white;
        }
        .form-floating-custom .form-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a9bb0;
            font-size: 1.2rem;
            pointer-events: none;
            z-index: 2;
            transition: color 0.2s;
        }
        .form-floating-custom .form-control:focus + .form-icon,
        .form-floating-custom .form-control:not(:placeholder-shown) + .form-icon {
            color: #2a6df4;
        }

        .form-floating-custom .form-label {
            position: absolute;
            left: 46px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 600;
            font-size: 0.85rem;
            color: #8a9bb0;
            pointer-events: none;
            transition: all 0.2s;
            background: transparent;
            padding: 0 4px;
            margin: 0;
        }
        .form-floating-custom .form-control:focus ~ .form-label,
        .form-floating-custom .form-control:not(:placeholder-shown) ~ .form-label {
            top: 8px;
            transform: translateY(0);
            font-size: 0.65rem;
            color: #2a6df4;
            background: white;
            padding: 0 6px;
            border-radius: 6px;
        }

        .btn-login {
            background: #0b1e33;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            width: 100%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }
        .btn-login:hover {
            background: #1a3b6b;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(11,30,51,0.25);
        }
        .btn-login:active {
            transform: scale(0.97);
        }

        .login-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .login-links a {
            color: #6b7b8f;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .login-links a:hover {
            color: #2a6df4;
        }

        .login-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 0.7rem;
            color: #8a9bb0;
            letter-spacing: 0.02em;
        }
        .login-footer i {
            color: #2a6df4;
        }

        .alert-custom {
            border-radius: 16px;
            padding: 12px 18px;
            margin-bottom: 20px;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            font-size: 0.9rem;
            background: #fde8e6;
            color: #7a2a2a;
        }
        .alert-custom i {
            font-size: 1.2rem;
        }

        .modal-modern .modal-content {
            border-radius: 28px;
            border: none;
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.2);
            overflow: hidden;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(8px);
        }
        .modal-modern .modal-header {
            border-bottom: none;
            padding: 24px 28px 8px 28px;
            background: #fdf3e0 !important;
        }
        .modal-modern .modal-header .modal-title {
            font-weight: 700;
            color: #0b1e33;
        }
        .modal-modern .modal-body {
            padding: 16px 28px 24px;
        }
        .modal-modern .modal-footer {
            border-top: none;
            padding: 8px 28px 24px;
        }
        .modal-modern .form-control {
            border-radius: 16px;
            border: 1.5px solid #e9edf4;
            padding: 14px 18px;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.6);
            transition: all 0.2s;
            height: 54px;
        }
        .modal-modern .form-control:focus {
            border-color: #2a6df4;
            box-shadow: 0 0 0 4px rgba(42,109,244,0.08);
            background: white;
        }
        .modal-modern .btn-warning-custom {
            background: #f5b342;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-weight: 700;
            color: #0b1e33;
            width: 100%;
            transition: all 0.2s;
        }
        .modal-modern .btn-warning-custom:hover {
            background: #e6a030;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -8px rgba(245,179,66,0.3);
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11,30,51,0.95);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeOut 0.5s ease forwards;
            animation-delay: 1.5s;
            pointer-events: none;
        }
        .loading-content {
            text-align: center;
        }
        .loading-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulseLogo 1.5s infinite ease-in-out;
        }
        .loading-logo img {
            width: 55px;
            height: auto;
        }
        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #f5b342;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 0.8s linear infinite;
        }
        .loading-text {
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @media (max-width: 480px) {
            .login-card { padding: 24px 20px; }
            .login-title { font-size: 1.4rem; }
            .form-floating-custom .form-control { height: 50px; padding: 12px 14px 12px 42px; font-size: 0.9rem; }
            .form-floating-custom .form-icon { font-size: 1rem; left: 14px; }
        }
    </style>
</head>
<body>

<!-- LOADING OVERLAY -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
        <div class="loading-logo">
            <img src="/static/img/logo.jpeg" alt="Lumen Legal" onerror="this.style.display='none'; this.parentElement.innerHTML='⚖️'; this.parentElement.style.fontSize='35px';">
        </div>
        <div class="loading-spinner"></div>
        <div class="loading-text">Accediendo al sistema...</div>
    </div>
</div>

<div class="login-container">
    <div class="login-card">

        <div class="logo-area">
            <img src="/static/img/logo.jpeg" alt="Lumen Legal">
        </div>

        <h1 class="login-title"><i class="bi bi-scale"></i> Lumen Legal</h1>
        <div class="login-subtitle">
            Sistema de Gestión Jurídica
            <span><i class="bi bi-shield-check me-1"></i> Seguro</span>
        </div>

        <div id="errorMessageContainer">
            <!-- ERROR_MESSAGE se inyecta aquí desde el backend -->
        </div>

        <form action="/auth/login" method="post" id="loginForm" onsubmit="showLoading()">
            <div class="form-floating-custom">
                <input type="text" name="email" id="loginIdentifier" class="form-control" 
                       placeholder=" " required autocomplete="off">
                <i class="bi bi-envelope form-icon"></i>
                <label class="form-label">Email o Usuario</label>
            </div>

            <div class="form-floating-custom">
                <input type="password" name="password" id="loginPassword" class="form-control" 
                       placeholder=" " required autocomplete="off">
                <i class="bi bi-lock form-icon"></i>
                <label class="form-label">Contraseña</label>
            </div>

            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar
            </button>
        </form>

        <div class="login-links">
            <a href="/auth/change-password-login">
                <i class="bi bi-key"></i> Cambiar Contraseña
            </a>
        </div>

        <div class="login-footer">
            <i class="bi bi-shield-check"></i> Lumen Legal v1.0
        </div>
    </div>
</div>

<!-- MODAL CAMBIO DE CONTRASEÑA -->
<div class="modal fade modal-modern" id="changePasswordModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-key me-2"></i> Cambio de Contraseña Obligatorio</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" style="display:none;"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted" style="font-size:0.95rem;">
                    Es tu <strong>primer acceso</strong>. Debes cambiar tu contraseña temporal por una nueva.
                </p>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nueva Contraseña <span class="text-danger">*</span></label>
                    <input type="password" id="newPassword" class="form-control" 
                           placeholder="Mínimo 6 caracteres" autocomplete="off">
                </div>
                <div class="mb-2">
                    <label class="form-label fw-semibold">Confirmar Contraseña <span class="text-danger">*</span></label>
                    <input type="password" id="confirmPassword" class="form-control" 
                           placeholder="Repite la contraseña" autocomplete="off">
                </div>
                <div id="passwordError" class="text-danger mt-2" style="display:none;font-size:0.9rem;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveNewPasswordBtn" class="btn-warning-custom">
                    <i class="bi bi-check2 me-2"></i> Guardar Nueva Contraseña
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Mostrar loading al enviar formulario
function showLoading() {
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.getElementById('loadingOverlay').style.animation = 'none';
    document.getElementById('loadingOverlay').style.opacity = '1';
    document.getElementById('loadingOverlay').style.visibility = 'visible';
}

// Ocultar loading si hay error
window.addEventListener('pageshow', function() {
    document.getElementById('loadingOverlay').style.display = 'none';
});

document.addEventListener('DOMContentLoaded', function() {
    // Verificar si debe cambiar contraseña
    fetch('/auth/check-password-change')
        .then(res => res.json())
        .then(data => {
            if (data.must_change) {
                new bootstrap.Modal(document.getElementById('changePasswordModal')).show();
            }
        })
        .catch(() => {});

    // Mostrar error del backend si existe
    const errorMsg = document.querySelector('#errorMessageContainer .alert');
    if (errorMsg) {
        const container = document.getElementById('errorMessageContainer');
        const existing = container.querySelector('.alert-custom');
        if (!existing) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert-custom';
            alertDiv.innerHTML = `<i class="bi bi-exclamation-circle"></i> ${errorMsg.textContent || 'Credenciales incorrectas'}`;
            container.innerHTML = '';
            container.appendChild(alertDiv);
        }
    }
});

// Cambio de contraseña
document.getElementById('saveNewPasswordBtn').addEventListener('click', async () => {
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const errorEl = document.getElementById('passwordError');

    if (!newPass || newPass.length < 6) {
        errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres';
        errorEl.style.display = 'block';
        return;
    }

    if (newPass !== confirmPass) {
        errorEl.textContent = 'Las contraseñas no coinciden';
        errorEl.style.display = 'block';
        return;
    }

    errorEl.style.display = 'none';

    const formData = new FormData();
    formData.append('new_password', newPass);

    try {
        const response = await fetch('/auth/change-password', {
            method: 'POST',
            body: formData
        });

        if (!response.ok) {
            const error = await response.json();
            errorEl.textContent = error.detail || 'Error al cambiar contraseña';
            errorEl.style.display = 'block';
            return;
        }

        bootstrap.Modal.getInstance(document.getElementById('changePasswordModal')).hide();
        window.location.reload();

    } catch (error) {
        errorEl.textContent = 'Error de conexión';
        errorEl.style.display = 'block';
    }
});
</script>
</body>
</html>
