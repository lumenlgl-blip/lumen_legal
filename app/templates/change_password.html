<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1e33" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a1523" media="(prefers-color-scheme: dark)">
    <title>Cambiar Contraseña · Lumen Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           VARIABLES DE TEMA
           ============================================================ */
        :root {
            --bg-primary: #f2f5fb;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f8fafc;
            --surface-glass: rgba(255,255,255,0.85);
            --surface-glass-strong: rgba(255,255,255,0.96);
            --border-subtle: rgba(255,255,255,0.5);
            --border-soft: #e9edf4;
            --border-strong: #d0d8e3;
            --text-primary: #0b1e33;
            --text-secondary: #4a5b6e;
            --text-muted: #6b7b8f;
            --text-light: #8a9bb0;
            --accent-primary: #2a6df4;
            --accent-light: #7aa9ff;
            --accent-dark: #0b1e33;
            --gold: #f5b342;
            --gold-dark: #e6a030;
            --gold-soft: #fdf3e0;
            --gold-text: #b7791f;
            --success: #1a8b5c;
            --success-hover: #0e6b46;
            --success-soft: #d1fae5;
            --warning: #f5b342;
            --warning-soft: #fdf3e0;
            --danger: #dc3545;
            --danger-hover: #b02a37;
            --danger-soft: #fee9e7;
            --info: #1f6f9e;
            --info-soft: #e3effa;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 48px -12px rgba(0,20,40,0.12);
            --shadow-xl: 0 40px 80px -20px rgba(0,0,0,0.2);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 28px;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0a1523;
            --bg-secondary: #111d2e;
            --bg-tertiary: #16243a;
            --surface-glass: rgba(22,36,58,0.78);
            --surface-glass-strong: rgba(22,36,58,0.94);
            --border-subtle: rgba(255,255,255,0.08);
            --border-soft: #223147;
            --border-strong: #2d3f5a;
            --text-primary: #e8eef7;
            --text-secondary: #b8c5d6;
            --text-muted: #8a9bb0;
            --text-light: #6b7b8f;
            --accent-primary: #5b93ff;
            --accent-light: #a8c5ff;
            --accent-dark: #5b93ff;
            --gold: #fbbf24;
            --gold-dark: #f59e0b;
            --gold-soft: rgba(251,191,36,0.12);
            --gold-text: #fbbf24;
            --success: #34d399;
            --success-hover: #10b981;
            --success-soft: rgba(52,211,153,0.15);
            --warning: #fbbf24;
            --warning-soft: rgba(251,191,36,0.15);
            --danger: #f87171;
            --danger-hover: #ef4444;
            --danger-soft: rgba(248,113,113,0.15);
            --info: #60a5fa;
            --info-soft: rgba(96,165,250,0.15);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 20px 48px -12px rgba(0,0,0,0.5);
            --shadow-xl: 0 40px 80px -20px rgba(0,0,0,0.6);
        }

        * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            background: var(--bg-primary);
            background-image:
                radial-gradient(at 100% 0%, rgba(245,179,66,0.08) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(42,109,244,0.06) 0px, transparent 50%);
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
            transition: background-color var(--transition-normal), color var(--transition-normal);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Blobs decorativos */
        body::before {
            content: '';
            position: fixed;
            top: -40%; right: -20%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(245,179,66,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatSlow 15s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%; left: -15%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(42,109,244,0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatSlow 18s ease-in-out infinite reverse;
        }
        @keyframes floatSlow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }

        /* ============================================================
           THEME TOGGLE
           ============================================================ */
        .theme-toggle {
            position: fixed;
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            z-index: 1050;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--surface-glass-strong);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: all var(--transition-normal);
        }
        .theme-toggle:hover {
            transform: translateY(-2px) rotate(15deg);
            box-shadow: var(--shadow-lg);
            color: var(--accent-primary);
        }
        .theme-toggle:active { transform: scale(0.95); }

        /* ============================================================
           CONTAINER
           ============================================================ */
        .password-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .password-card {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-xl);
            padding: 40px 36px 32px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-subtle);
            transition: box-shadow var(--transition-normal);
            position: relative;
            overflow: hidden;
            animation: cardEnter 0.6s var(--transition-bounce);
        }

        /* Línea superior con gradiente animado */
        .password-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--accent-primary), var(--success));
            background-size: 200% 100%;
            animation: gradientSlide 4s ease infinite;
        }
        @keyframes gradientSlide {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .password-card:hover { box-shadow: var(--shadow-xl); }

        /* ============================================================
           ICONO
           ============================================================ */
        .icon-wrapper {
            width: 88px;
            height: 88px;
            border-radius: 28px;
            background: linear-gradient(135deg, var(--gold-soft), rgba(245,179,66,0.02));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            position: relative;
            border: 1.5px solid rgba(245,179,66,0.2);
        }
        .icon-wrapper i {
            font-size: 2.9rem;
            color: var(--gold);
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 4px 12px rgba(245,179,66,0.3));
        }
        .icon-wrapper .pulse-ring {
            position: absolute;
            inset: 0;
            border-radius: 28px;
            border: 2px solid var(--gold);
            animation: pulseRing 2.4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pulseRing {
            0%, 100% { transform: scale(1); opacity: 0.35; }
            50% { transform: scale(1.12); opacity: 0; }
        }

        /* ============================================================
           TÍTULOS
           ============================================================ */
        .password-title {
            font-weight: 800;
            font-size: 1.65rem;
            color: var(--text-primary);
            letter-spacing: -0.025em;
            margin-bottom: 8px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .password-title i {
            color: var(--gold);
            font-size: 1.5rem;
        }

        .password-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .password-subtitle .highlight {
            background: var(--gold-soft);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--gold-text);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        .password-subtitle .highlight i { font-size: 0.8rem; }

        .password-subtitle .sub-line {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ============================================================
           FORM FIELD — LABELS ARRIBA
           ============================================================ */
        .pwd-field {
            margin-bottom: 22px;
            position: relative;
            text-align: left;
            animation: fadeInUp 0.5s ease-out backwards;
        }
        .pwd-field:nth-of-type(1) { animation-delay: 0.15s; }
        .pwd-field:nth-of-type(2) { animation-delay: 0.2s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pwd-field .field-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            padding-left: 2px;
            transition: color var(--transition-fast);
        }
        .pwd-field .field-label i {
            color: var(--gold);
            font-size: 0.9rem;
        }
        .pwd-field .field-label .required {
            color: var(--danger);
            margin-left: 2px;
        }
        .pwd-field:focus-within .field-label {
            color: var(--text-primary);
        }

        /* Wrapper del input */
        .pwd-field .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Input con icono izquierdo + toggle derecho */
        .pwd-field .form-control {
            width: 100%;
            height: 58px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border-soft);
            padding: 0 52px 0 52px;
            font-size: 1rem;
            font-weight: 500;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: border-color var(--transition-fast),
                        box-shadow var(--transition-fast),
                        background-color var(--transition-fast);
            outline: none;
        }
        .pwd-field .form-control::placeholder {
            color: var(--text-light);
            font-weight: 400;
            opacity: 0.85;
        }
        .pwd-field .form-control:hover {
            border-color: var(--border-strong);
        }
        .pwd-field .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(245,179,66,0.15);
            background: var(--bg-secondary);
        }
        .pwd-field .form-control.is-invalid {
            border-color: var(--danger);
            background-image: none;
        }
        .pwd-field .form-control.is-invalid:focus {
            box-shadow: 0 0 0 4px rgba(220,53,69,0.12);
        }

        /* Icono izquierdo */
        .pwd-field .field-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.15rem;
            pointer-events: none;
            z-index: 2;
            transition: color var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pwd-field:focus-within .field-icon {
            color: var(--gold);
        }

        /* Toggle ver/ocultar contraseña */
        .pwd-field .pwd-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 1.1rem;
            padding: 8px;
            cursor: pointer;
            border-radius: 10px;
            transition: all var(--transition-fast);
            z-index: 3;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .pwd-field .pwd-toggle:hover {
            color: var(--gold);
            background: rgba(245,179,66,0.1);
        }
        .pwd-field .pwd-toggle:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        /* ============================================================
           MEDIDOR DE FORTALEZA
           ============================================================ */
        .strength-meter {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeInUp 0.3s ease-out;
        }
        .strength-bar {
            flex: 1;
            height: 6px;
            border-radius: 6px;
            background: var(--border-soft);
            overflow: hidden;
        }
        .strength-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.35s ease, background-color 0.35s ease;
            background: var(--border-soft);
        }
        .strength-bar-fill.weak { width: 33%; background: var(--danger); }
        .strength-bar-fill.medium { width: 66%; background: var(--warning); }
        .strength-bar-fill.strong { width: 100%; background: var(--success); }

        .strength-label {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-light);
            min-width: 60px;
            text-align: right;
            transition: color var(--transition-fast);
        }
        .strength-label.weak { color: var(--danger); }
        .strength-label.medium { color: var(--warning); }
        .strength-label.strong { color: var(--success); }

        /* ============================================================
           REQUISITOS
           ============================================================ */
        .password-requirements {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-top: 14px;
            border: 1px solid var(--border-soft);
            animation: fadeInUp 0.3s ease-out;
        }
        .password-requirements .req-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: color var(--transition-normal);
        }
        .password-requirements .req-item i {
            font-size: 0.85rem;
            transition: transform var(--transition-fast);
        }
        .password-requirements .req-item.valid {
            color: var(--success);
        }
        .password-requirements .req-item.valid i {
            transform: scale(1.15);
        }
        .password-requirements .req-item.invalid {
            color: var(--danger);
        }

        /* ============================================================
           BOTÓN PRINCIPAL
           ============================================================ */
        .btn-change {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border: none;
            border-radius: 60px;
            padding: 16px 28px;
            font-weight: 800;
            font-size: 1rem;
            color: #0b1e33;
            width: 100%;
            transition: all var(--transition-normal);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            min-height: 56px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            animation: fadeInUp 0.4s ease-out 0.35s backwards;
        }
        .btn-change::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            transition: left 0.6s ease;
        }
        .btn-change:hover:not(:disabled)::before { left: 100%; }
        .btn-change:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--gold-dark), #d69020);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(245,179,66,0.5);
        }
        .btn-change:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }
        .btn-change:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(11,30,51,0.3);
            border-top-color: #0b1e33;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.72rem;
            color: var(--text-light);
            letter-spacing: 0.02em;
            animation: fadeInUp 0.4s ease-out 0.4s backwards;
        }
        .footer-text i {
            color: var(--gold);
            margin-right: 4px;
        }

        /* ============================================================
           MODALES MODERNOS
           ============================================================ */
        .modal-modern .modal-content {
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            background: var(--surface-glass-strong);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text-primary);
        }
        .modal-modern .modal-header {
            border-bottom: none;
            padding: 22px 28px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-modern .modal-header .modal-title {
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-modern .modal-body {
            padding: 18px 28px 24px;
            text-align: center;
        }
        .modal-modern .modal-footer {
            border-top: 1px solid var(--border-soft);
            padding: 16px 28px 22px;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .modal-modern .modal-footer .btn {
            border-radius: 60px;
            font-weight: 700;
            padding: 10px 24px;
            min-height: 44px;
        }

        .modal.fade .modal-dialog {
            transform: scale(0.92) translateY(20px);
            opacity: 0;
            transition: transform 0.35s var(--transition-bounce), opacity 0.3s ease;
        }
        .modal.show .modal-dialog {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        [data-theme="dark"] .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }
        .btn-close-white { filter: invert(1) grayscale(100%) brightness(200%); }
        [data-theme="dark"] .btn-close-white { filter: none; }

        .modal-header.header-success { background: linear-gradient(135deg, var(--success), var(--success-hover)); }
        .modal-header.header-error { background: linear-gradient(135deg, var(--danger), var(--danger-hover)); }
        .modal-header.header-warning { background: linear-gradient(135deg, var(--warning), var(--gold-dark)); }
        .modal-header.header-info { background: linear-gradient(135deg, var(--accent-primary), var(--accent-dark)); }

        .modal-header.header-success .modal-title,
        .modal-header.header-error .modal-title,
        .modal-header.header-info .modal-title { color: white; }
        .modal-header.header-warning .modal-title { color: #0b1e33; }

        .notification-icon {
            font-size: 3.5rem;
            text-align: center;
            display: block;
            margin: 8px 0 16px;
            animation: popIn 0.5s var(--transition-bounce);
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .notification-icon.success { color: var(--success); }
        .notification-icon.error { color: var(--danger); }
        .notification-icon.warning { color: var(--warning); }
        .notification-icon.info { color: var(--accent-primary); }

        /* ============================================================
           SPINNER OVERLAY
           ============================================================ */
        .spinner-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11,30,51,0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .spinner-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .spinner-box {
            background: var(--bg-secondary);
            padding: 40px 52px;
            border-radius: var(--radius-xl);
            text-align: center;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-subtle);
            animation: popIn 0.4s var(--transition-bounce);
            max-width: 90vw;
        }
        .spinner-box .spinner-border {
            width: 3rem;
            height: 3rem;
            color: var(--gold);
            border-width: 3px;
        }
        .spinner-box h5 {
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 16px;
        }
        .spinner-box p {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 0;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            body {
                padding: 16px;
                padding-top: max(20px, env(safe-area-inset-top));
                align-items: flex-start;
            }
            body::before, body::after { display: none; }

            .theme-toggle {
                width: 44px;
                height: 44px;
                top: max(12px, env(safe-area-inset-top));
                right: max(12px, env(safe-area-inset-right));
                font-size: 1rem;
            }

            .password-container { max-width: 100%; }
            .password-card {
                padding: 28px 22px 24px;
                border-radius: var(--radius-lg);
                box-shadow: var(--shadow-md);
            }
            .password-title { font-size: 1.4rem; }
            .password-title i { font-size: 1.3rem; }
            .password-subtitle { font-size: 0.85rem; margin-bottom: 22px; }
            .pwd-field .form-control { font-size: 16px; height: 54px; }
            .btn-change { font-size: 0.95rem; min-height: 52px; padding: 14px 22px; }

            .modal-modern .modal-header { padding: 18px 20px 10px; }
            .modal-modern .modal-body { padding: 14px 20px 20px; }
            .modal-modern .modal-footer { padding: 12px 20px 18px; }
        }

        @media (max-width: 480px) {
            body { padding: 10px; padding-top: max(14px, env(safe-area-inset-top)); }

            .theme-toggle { top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); width: 42px; height: 42px; }

            .password-card { padding: 22px 16px 20px; border-radius: 20px; }

            .icon-wrapper {
                width: 72px;
                height: 72px;
                border-radius: 22px;
                margin-bottom: 16px;
            }
            .icon-wrapper i { font-size: 2.3rem; }
            .icon-wrapper .pulse-ring { border-radius: 22px; }

            .password-title { font-size: 1.25rem; }
            .password-title i { font-size: 1.15rem; }
            .password-subtitle { font-size: 0.8rem; margin-bottom: 18px; }
            .password-subtitle .highlight { font-size: 0.68rem; padding: 3px 12px; }

            .pwd-field { margin-bottom: 18px; }
            .pwd-field .field-label { font-size: 0.8rem; margin-bottom: 8px; }
            .pwd-field .form-control {
                height: 52px;
                font-size: 16px;
                padding: 0 46px 0 46px;
                border-radius: 14px;
            }
            .pwd-field .field-icon { left: 15px; font-size: 1rem; }
            .pwd-field .pwd-toggle { right: 6px; width: 38px; height: 38px; }

            .password-requirements { padding: 12px; gap: 6px; }
            .password-requirements .req-item { font-size: 0.72rem; }

            .btn-change {
                padding: 14px 18px;
                font-size: 0.92rem;
                min-height: 50px;
                border-radius: 14px;
            }

            .footer-text { font-size: 0.65rem; margin-top: 16px; }

            .spinner-box { padding: 30px 28px; }
        }

        /* Landscape en móvil */
        @media (max-height: 600px) and (orientation: landscape) {
            body { align-items: flex-start; padding: 10px; }
            .icon-wrapper { width: 60px; height: 60px; margin-bottom: 12px; }
            .icon-wrapper i { font-size: 1.8rem; }
            .password-card { padding: 20px 24px; }
            .password-title { font-size: 1.2rem; }
            .password-subtitle { margin-bottom: 16px; }
            .pwd-field { margin-bottom: 14px; }
            .btn-change { margin-top: 14px; }
        }

        /* Fix iOS backdrop-filter */
        @supports (-webkit-touch-callout: none) {
            .password-card {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: var(--surface-glass-strong);
            }
        }

        /* ============================================================
           ACCESIBILIDAD
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        :focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border-soft);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-light); }
    </style>
</head>
<body>

<!-- ============================================================ -->
<!-- THEME TOGGLE -->
<!-- ============================================================ -->
<button class="theme-toggle" id="themeToggle" type="button"
        aria-label="Cambiar tema" title="Cambiar tema claro/oscuro">
    <i class="bi bi-moon-stars" id="themeIcon"></i>
</button>

<div class="password-container">

    <!-- ============================================================ -->
    <!-- CARD PRINCIPAL -->
    <!-- ============================================================ -->
    <div class="password-card">

        <!-- Icono con anillo pulsante -->
        <div class="icon-wrapper">
            <span class="pulse-ring"></span>
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <!-- Títulos -->
        <h1 class="password-title">
            <i class="bi bi-key-fill"></i> Cambio de Contraseña
        </h1>

        <div class="password-subtitle">
            <span class="highlight">
                <i class="bi bi-exclamation-triangle-fill"></i>
                Primer acceso obligatorio
            </span>
            <span class="sub-line">Debes cambiar tu contraseña temporal</span>
        </div>

        <!-- Formulario -->
        <form id="changePasswordForm" novalidate>

            <!-- Campo: Nueva Contraseña -->
            <div class="pwd-field" id="fieldNew">
                <label class="field-label" for="newPassword">
                    <i class="bi bi-lock-fill"></i>
                    Nueva Contraseña <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <span class="field-icon" aria-hidden="true">
                        <i class="bi bi-shield-lock"></i>
                    </span>
                    <input type="password" id="newPassword"
                           class="form-control"
                           placeholder="Ingresa tu nueva contraseña"
                           required autocomplete="new-password"
                           maxlength="200"
                           aria-label="Nueva contraseña">
                    <button type="button" class="pwd-toggle" data-target="newPassword"
                            aria-label="Mostrar contraseña" title="Mostrar/ocultar">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>

                <!-- Medidor de fortaleza -->
                <div class="strength-meter">
                    <div class="strength-bar">
                        <div class="strength-bar-fill" id="strengthBarFill"></div>
                    </div>
                    <span class="strength-label" id="strengthLabel">—</span>
                </div>

                <!-- Requisitos -->
                <div class="password-requirements" id="requirements">
                    <span class="req-item" id="reqLength">
                        <i class="bi bi-circle"></i> Mínimo 6 caracteres
                    </span>
                    <span class="req-item" id="reqMatch">
                        <i class="bi bi-circle"></i> Coinciden ambas contraseñas
                    </span>
                </div>
            </div>

            <!-- Campo: Confirmar Contraseña -->
            <div class="pwd-field" id="fieldConfirm">
                <label class="field-label" for="confirmPassword">
                    <i class="bi bi-shield-check"></i>
                    Confirmar Contraseña <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <span class="field-icon" aria-hidden="true">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input type="password" id="confirmPassword"
                           class="form-control"
                           placeholder="Repite tu contraseña"
                           required autocomplete="new-password"
                           maxlength="200"
                           aria-label="Confirmar contraseña">
                    <button type="button" class="pwd-toggle" data-target="confirmPassword"
                            aria-label="Mostrar contraseña" title="Mostrar/ocultar">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Botón principal -->
            <button type="submit" class="btn-change" id="submitBtn">
                <i class="bi bi-check-circle-fill"></i>
                <span>Guardar Nueva Contraseña</span>
            </button>
        </form>

        <!-- Footer -->
        <div class="footer-text">
            <i class="bi bi-shield-check"></i> Lumen Legal v1.0
        </div>
    </div>

</div>

<!-- ============================================================ -->
<!-- MODAL DE NOTIFICACIÓN -->
<!-- ============================================================ -->
<div class="modal fade modal-modern" id="notificationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" id="notificationHeader">
                <h5 class="modal-title" id="notificationTitle">Notificación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="notificationBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- LOADING OVERLAY -->
<!-- ============================================================ -->
<div id="loadingOverlay" class="spinner-overlay" role="status" aria-live="polite">
    <div class="spinner-box">
        <div class="spinner-border" role="status"></div>
        <h5>Actualizando contraseña</h5>
        <p>Un momento, por favor.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
'use strict';

/* ============================================================
   TEMA CLARO / OSCURO
   ============================================================ */
(function initTheme() {
    const saved = localStorage.getItem('lumen-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeIcon(theme);
})();

function updateThemeIcon(theme) {
    const icon = document.getElementById('themeIcon');
    if (!icon) return;
    icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars';
}

document.getElementById('themeToggle')?.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('lumen-theme', next);
    updateThemeIcon(next);
});

// Atajo de teclado "T"
document.addEventListener('keydown', (e) => {
    if (!e || typeof e.key !== 'string') return;
    if (e.key.toLowerCase() === 't' && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const tag = document.activeElement?.tagName;
        if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
            document.getElementById('themeToggle')?.click();
        }
    }
});

/* ============================================================
   UTILIDADES
   ============================================================ */
function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

/* ============================================================
   MODAL NOTIFICACIÓN
   ============================================================ */
function showNotification(title, bodyHTML, type = 'info') {
    const modalEl = document.getElementById('notificationModal');
    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    const header = document.getElementById('notificationHeader');
    const titleEl = document.getElementById('notificationTitle');
    const bodyEl = document.getElementById('notificationBody');

    header.className = 'modal-header';
    let iconHTML = '';

    if (type === 'success') {
        header.classList.add('header-success');
        iconHTML = '<i class="bi bi-check-circle-fill notification-icon success"></i>';
    } else if (type === 'error') {
        header.classList.add('header-error');
        iconHTML = '<i class="bi bi-x-circle-fill notification-icon error"></i>';
    } else if (type === 'warning') {
        header.classList.add('header-warning');
        iconHTML = '<i class="bi bi-exclamation-triangle-fill notification-icon warning"></i>';
    } else {
        header.classList.add('header-info');
        iconHTML = '<i class="bi bi-info-circle-fill notification-icon info"></i>';
    }

    titleEl.textContent = title;
    bodyEl.innerHTML = iconHTML + bodyHTML;
    modal.show();
}

/* ============================================================
   LOADING
   ============================================================ */
function showLoading() {
    document.getElementById('loadingOverlay').classList.add('active');
}
function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('active');
}

/* ============================================================
   TOGGLE MOSTRAR/OCULTAR CONTRASEÑA
   ============================================================ */
document.querySelectorAll('.pwd-toggle').forEach(btn => {
    btn.addEventListener('click', function () {
        const targetId = this.dataset.target;
        const input = document.getElementById(targetId);
        const icon = this.querySelector('i');
        if (!input || !icon) return;

        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        icon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        this.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
});

/* ============================================================
   VALIDACIÓN DE REQUISITOS Y MEDIDOR
   ============================================================ */
const newPassInput = document.getElementById('newPassword');
const confirmPassInput = document.getElementById('confirmPassword');
const reqLength = document.getElementById('reqLength');
const reqMatch = document.getElementById('reqMatch');
const strengthBarFill = document.getElementById('strengthBarFill');
const strengthLabel = document.getElementById('strengthLabel');
const fieldNew = document.getElementById('fieldNew');
const fieldConfirm = document.getElementById('fieldConfirm');

function evaluarFortaleza(val) {
    return {
        length: val.length >= 6,
        upper: /[A-Z]/.test(val),
        lower: /[a-z]/.test(val),
        number: /[0-9]/.test(val),
        special: /[^A-Za-z0-9]/.test(val)
    };
}

function actualizarMedidor() {
    const val = newPassInput.value;
    const checks = evaluarFortaleza(val);
    const metCount = [checks.length, checks.upper, checks.lower, checks.number, checks.special]
        .filter(Boolean).length;

    strengthBarFill?.classList.remove('weak', 'medium', 'strong');
    strengthLabel?.classList.remove('weak', 'medium', 'strong');

    if (val.length === 0) {
        if (strengthBarFill) strengthBarFill.style.width = '0%';
        if (strengthLabel) strengthLabel.textContent = '—';
    } else if (metCount <= 1) {
        strengthBarFill?.classList.add('weak');
        strengthLabel?.classList.add('weak');
        if (strengthLabel) strengthLabel.textContent = 'Débil';
    } else if (metCount <= 3) {
        strengthBarFill?.classList.add('medium');
        strengthLabel?.classList.add('medium');
        if (strengthLabel) strengthLabel.textContent = 'Media';
    } else {
        strengthBarFill?.classList.add('strong');
        strengthLabel?.classList.add('strong');
        if (strengthLabel) strengthLabel.textContent = 'Fuerte';
    }
}

function validateRequirements() {
    const newPass = newPassInput.value;
    const confirmPass = confirmPassInput.value;

    // Validar longitud
    if (newPass.length >= 6) {
        reqLength.className = 'req-item valid';
        reqLength.innerHTML = '<i class="bi bi-check-circle-fill"></i> Mínimo 6 caracteres';
    } else {
        reqLength.className = 'req-item invalid';
        reqLength.innerHTML = '<i class="bi bi-circle"></i> Mínimo 6 caracteres';
    }

    // Validar coincidencia
    if (newPass.length > 0 && newPass === confirmPass) {
        reqMatch.className = 'req-item valid';
        reqMatch.innerHTML = '<i class="bi bi-check-circle-fill"></i> Coinciden ambas contraseñas';
        confirmPassInput.classList.remove('is-invalid');
        fieldConfirm?.classList.remove('has-error');
    } else if (confirmPass.length > 0) {
        reqMatch.className = 'req-item invalid';
        reqMatch.innerHTML = '<i class="bi bi-x-circle-fill"></i> Las contraseñas no coinciden';
    } else {
        reqMatch.className = 'req-item';
        reqMatch.innerHTML = '<i class="bi bi-circle"></i> Coinciden ambas contraseñas';
    }

    actualizarMedidor();
}

newPassInput.addEventListener('input', function () {
    this.classList.remove('is-invalid');
    fieldNew?.classList.remove('has-error');
    validateRequirements();
});

confirmPassInput.addEventListener('input', function () {
    this.classList.remove('is-invalid');
    fieldConfirm?.classList.remove('has-error');
    validateRequirements();
});

/* ============================================================
   ENTER EN CONFIRMAR → ENVÍA EL FORMULARIO
   ============================================================ */
confirmPassInput?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('submitBtn')?.click();
    }
});

/* ============================================================
   ENVÍO DEL FORMULARIO
   ============================================================ */
document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const newPass = newPassInput.value;
    const confirmPass = confirmPassInput.value;
    const submitBtn = document.getElementById('submitBtn');

    if (!newPass || newPass.length < 6) {
        showNotification('Contraseña inválida',
            '<p>La contraseña debe tener al menos <strong>6 caracteres</strong>.</p>', 'warning');
        newPassInput.classList.add('is-invalid');
        fieldNew?.classList.add('has-error');
        newPassInput.focus();
        return;
    }

    if (newPass !== confirmPass) {
        showNotification('No coinciden',
            '<p>Las contraseñas no coinciden. Por favor, verifica.</p>', 'warning');
        confirmPassInput.classList.add('is-invalid');
        fieldConfirm?.classList.add('has-error');
        confirmPassInput.focus();
        return;
    }

    // Prevenir doble submit
    if (submitBtn.disabled) return;
    const originalHTML = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="btn-spinner"></span> <span>Guardando...</span>';

    showLoading();

    const formData = new FormData();
    formData.append('new_password', newPass);

    try {
        const controller = new AbortController();
        const tId = setTimeout(() => controller.abort(), 30000);

        const response = await fetch('/auth/change-password', {
            method: 'POST',
            body: formData,
            signal: controller.signal
        });
        clearTimeout(tId);

        hideLoading();

        if (!response.ok) {
            let errorMsg = 'Error al cambiar la contraseña.';
            try {
                const error = await response.json();
                if (error && error.detail) errorMsg = error.detail;
            } catch (_) {}
            showNotification('Error', `<p>${escapeHTML(errorMsg)}</p>`, 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalHTML;
            return;
        }

        showNotification('¡Contraseña Actualizada!',
            `<p>Tu contraseña se cambió correctamente.</p>
             <p class="text-muted small mb-0 mt-2">
                <i class="bi bi-arrow-right-circle me-1"></i>
                Serás redirigido al inicio...
             </p>`,
            'success');

        setTimeout(() => {
            window.location.href = '/';
        }, 1500);

    } catch (error) {
        hideLoading();
        let msg = error.message || 'Error de conexión';
        if (error.name === 'AbortError') msg = 'La operación tardó demasiado. Verifica tu conexión.';
        showNotification('Error', `<p>${escapeHTML(msg)}</p>`, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalHTML;
    }
});

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
    validateRequirements();
    if (window.innerWidth > 768) {
        setTimeout(() => newPassInput?.focus(), 400);
    }
});
</script>
</body>
</html>
