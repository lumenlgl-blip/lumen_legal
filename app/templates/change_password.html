<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña · Lumen Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f2f5fb;
            position: relative;
            overflow: hidden;
        }

        /* Fondo decorativo */
        body::before {
            content: '';
            position: fixed;
            top: -40%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(245,179,66,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(42,109,244,0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .password-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .password-card {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 36px 32px 32px;
            box-shadow: 0 24px 56px -16px rgba(0,20,40,0.16);
            border: 1px solid rgba(255,255,255,0.5);
            transition: box-shadow 0.2s;
            text-align: center;
        }
        .password-card:hover {
            box-shadow: 0 32px 72px -20px rgba(0,20,40,0.2);
        }

        /* Icono */
        .icon-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(245,179,66,0.15), rgba(245,179,66,0.04));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            position: relative;
        }
        .icon-wrapper i {
            font-size: 2.8rem;
            color: #f5b342;
        }
        .icon-wrapper .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 28px;
            border: 2px solid rgba(245,179,66,0.15);
            animation: pulse-ring 2.4s ease-in-out infinite;
        }
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.08); opacity: 0.1; }
        }

        .password-title {
            font-weight: 700;
            font-size: 1.6rem;
            color: #0b1e33;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }
        .password-title i {
            color: #f5b342;
            margin-right: 6px;
        }
        .password-subtitle {
            color: #6b7b8f;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .password-subtitle .highlight {
            background: #fdf3e0;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #b7791f;
            display: inline-block;
        }
        .password-subtitle .highlight i {
            margin-right: 4px;
        }

        /* Campos de formulario */
        .form-floating-custom {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }
        .form-floating-custom .form-control {
            border-radius: 16px;
            border: 1.5px solid #e9edf4;
            padding: 14px 18px 14px 46px;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.6);
            transition: all 0.2s;
            height: 56px;
        }
        .form-floating-custom .form-control:focus {
            border-color: #f5b342;
            box-shadow: 0 0 0 4px rgba(245,179,66,0.12);
            background: white;
        }
        .form-floating-custom .form-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a9bb0;
            font-size: 1.1rem;
            pointer-events: none;
            z-index: 2;
            transition: color 0.2s;
        }
        .form-floating-custom .form-control:focus + .form-icon,
        .form-floating-custom .form-control:not(:placeholder-shown) + .form-icon {
            color: #f5b342;
        }

        .form-floating-custom .form-label {
            position: absolute;
            left: 46px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 600;
            font-size: 0.85rem;
            color: #8a9bb0;
            pointer-events: none;
            transition: all 0.2s;
            background: transparent;
            padding: 0 4px;
            margin: 0;
        }
        .form-floating-custom .form-control:focus ~ .form-label,
        .form-floating-custom .form-control:not(:placeholder-shown) ~ .form-label {
            top: 8px;
            transform: translateY(0);
            font-size: 0.65rem;
            color: #f5b342;
            background: white;
            padding: 0 6px;
            border-radius: 6px;
        }

        /* Botón */
        .btn-change {
            background: #f5b342;
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-weight: 700;
            font-size: 1rem;
            color: #0b1e33;
            width: 100%;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }
        .btn-change:hover {
            background: #e6a030;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(245,179,66,0.35);
        }
        .btn-change:active {
            transform: scale(0.97);
        }
        .btn-change i {
            font-size: 1.1rem;
        }

        /* Requisitos de contraseña */
        .password-requirements {
            text-align: left;
            background: rgba(255,255,255,0.4);
            border-radius: 14px;
            padding: 10px 14px;
            margin-top: 4px;
            font-size: 0.75rem;
            color: #6b7b8f;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
        }
        .password-requirements .req-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .password-requirements .req-item i {
            font-size: 0.7rem;
        }
        .password-requirements .req-item.valid {
            color: #1a8b5c;
        }
        .password-requirements .req-item.invalid {
            color: #b12a2a;
        }

        .footer-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.7rem;
            color: #8a9bb0;
            letter-spacing: 0.02em;
        }
        .footer-text i {
            color: #f5b342;
        }

        /* Modal moderno */
        .modal-modern .modal-content {
            border-radius: 28px;
            border: none;
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.2);
            overflow: hidden;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(8px);
        }
        .modal-modern .modal-header {
            border-bottom: none;
            padding: 20px 28px 8px 28px;
        }
        .modal-modern .modal-header .modal-title {
            font-weight: 700;
            color: #0b1e33;
        }
        .modal-modern .modal-body {
            padding: 16px 28px 24px;
        }
        .modal-modern .modal-footer {
            border-top: none;
            padding: 8px 28px 24px;
        }
        .modal-modern .btn-close-white {
            filter: brightness(0) invert(1);
        }

        /* Loading overlay */
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11,30,51,0.4);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .spinner-box {
            background: white;
            padding: 36px 48px;
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.2);
        }
        .spinner-box .spinner-border {
            width: 3rem;
            height: 3rem;
            color: #f5b342;
        }
        .spinner-box h5 {
            font-weight: 700;
            color: #0b1e33;
            margin-top: 12px;
        }
        .spinner-box p {
            color: #6b7b8f;
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .password-card { padding: 24px 20px; }
            .password-title { font-size: 1.3rem; }
            .form-floating-custom .form-control { height: 50px; padding: 12px 14px 12px 42px; font-size: 0.9rem; }
            .form-floating-custom .form-icon { font-size: 1rem; left: 14px; }
            .icon-wrapper { width: 64px; height: 64px; }
            .icon-wrapper i { font-size: 2.2rem; }
            .password-requirements { font-size: 0.65rem; flex-direction: column; gap: 4px; }
        }
                /* ========== ADAPTACIÓN MÓVIL - SOLO RESPONSIVE ========== */
        @media (max-width: 768px){
            body{padding:16px; align-items:flex-start;}
            .password-container{max-width:100%;}
            .password-card{padding:28px 20px; border-radius:24px;}
            .password-title{font-size:1.4rem;}
            .form-floating-custom .form-control{font-size:16px;}
        }
        @media (max-width: 480px){
            body{padding:10px; overflow:auto;}
            body::before,body::after{display:none;}
            .password-container{padding:0;}
            .password-card{padding:20px 14px; border-radius:18px; margin:0;}
            .icon-wrapper{width:60px; height:60px; border-radius:18px;}
            .icon-wrapper i{font-size:2rem;}
            .password-title{font-size:1.2rem;}
            .password-subtitle{font-size:0.8rem; margin-bottom:16px;}
            .form-floating-custom{margin-bottom:12px;}
            .form-floating-custom .form-control{height:52px; font-size:16px;}
            .btn-change{padding:14px; font-size:16px; border-radius:14px;}
            .password-requirements{gap:4px; padding:10px;}
        }
    </style>
</head>
<body>

<div class="password-container">

    <!-- Tarjeta principal -->
    <div class="password-card">

        <!-- Icono -->
        <div class="icon-wrapper">
            <span class="pulse-ring"></span>
            <i class="bi bi-shield-lock"></i>
        </div>

        <!-- Títulos -->
        <h1 class="password-title"><i class="bi bi-key"></i> Cambio de Contraseña</h1>
        <div class="password-subtitle">
            <span class="highlight"><i class="bi bi-exclamation-triangle"></i> Primer acceso obligatorio</span>
            <br>
            <span style="font-size:0.85rem;color:#8a9bb0;">Debes cambiar tu contraseña temporal</span>
        </div>

        <!-- Formulario -->
        <form id="changePasswordForm">

            <div class="form-floating-custom">
                <input type="password" id="newPassword" class="form-control"
                       placeholder=" " required autocomplete="off">
                <i class="bi bi-shield-lock form-icon"></i>
                <label class="form-label">Nueva Contraseña</label>
            </div>

            <div class="form-floating-custom">
                <input type="password" id="confirmPassword" class="form-control"
                       placeholder=" " required autocomplete="off">
                <i class="bi bi-check-circle form-icon"></i>
                <label class="form-label">Confirmar Contraseña</label>
            </div>

            <!-- Requisitos de contraseña -->
            <div class="password-requirements" id="requirements">
                <span class="req-item" id="reqLength">
                    <i class="bi bi-circle"></i> Mínimo 6 caracteres
                </span>
                <span class="req-item" id="reqMatch">
                    <i class="bi bi-circle"></i> Coinciden ambas contraseñas
                </span>
            </div>

            <button type="submit" class="btn-change" id="submitBtn">
                <i class="bi bi-check2"></i> Guardar Nueva Contraseña
            </button>
        </form>

        <!-- Footer -->
        <div class="footer-text">
            <i class="bi bi-shield-check"></i> Lumen Legal v1.0
        </div>
    </div>

</div>

<!-- ================================================== -->
<!-- MODAL DE NOTIFICACIÓN (moderno) -->
<!-- ================================================== -->
<div class="modal fade modal-modern" id="notificationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" id="notificationHeader">
                <h5 class="modal-title" id="notificationTitle">Notificación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="notificationBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- ================================================== -->
<!-- LOADING OVERLAY -->
<!-- ================================================== -->
<div id="loadingOverlay" class="spinner-overlay">
    <div class="spinner-box">
        <div class="spinner-border" role="status"></div>
        <h5>Actualizando contraseña</h5>
        <p>Un momento, por favor.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Mostrar notificaciones en modal
    function showNotification(title, bodyHTML, type = 'info') {
        const modal = new bootstrap.Modal(document.getElementById('notificationModal'));
        const header = document.getElementById('notificationHeader');
        const titleEl = document.getElementById('notificationTitle');
        const bodyEl = document.getElementById('notificationBody');
        header.className = 'modal-header';
        if (type === 'success') {
            header.classList.add('bg-success', 'text-white');
            titleEl.textContent = '✅ ' + title;
        } else if (type === 'error') {
            header.classList.add('bg-danger', 'text-white');
            titleEl.textContent = '❌ ' + title;
        } else if (type === 'warning') {
            header.classList.add('bg-warning', 'text-dark');
            titleEl.textContent = '⚠️ ' + title;
        } else {
            header.classList.add('bg-primary', 'text-white');
            titleEl.textContent = 'ℹ️ ' + title;
        }
        bodyEl.innerHTML = bodyHTML;
        modal.show();
    }

    // Mostrar/ocultar loading
    function showLoading() {
        document.getElementById('loadingOverlay').style.display = 'flex';
    }
    function hideLoading() {
        document.getElementById('loadingOverlay').style.display = 'none';
    }

    // Validación en tiempo real de requisitos
    const newPassInput = document.getElementById('newPassword');
    const confirmPassInput = document.getElementById('confirmPassword');
    const reqLength = document.getElementById('reqLength');
    const reqMatch = document.getElementById('reqMatch');

    function validateRequirements() {
        const newPass = newPassInput.value;
        const confirmPass = confirmPassInput.value;

        // Validar longitud
        if (newPass.length >= 6) {
            reqLength.className = 'req-item valid';
            reqLength.innerHTML = '<i class="bi bi-check-circle-fill"></i> Mínimo 6 caracteres';
        } else {
            reqLength.className = 'req-item invalid';
            reqLength.innerHTML = '<i class="bi bi-circle"></i> Mínimo 6 caracteres';
        }

        // Validar coincidencia
        if (newPass.length > 0 && newPass === confirmPass) {
            reqMatch.className = 'req-item valid';
            reqMatch.innerHTML = '<i class="bi bi-check-circle-fill"></i> Coinciden ambas contraseñas';
        } else if (confirmPass.length > 0) {
            reqMatch.className = 'req-item invalid';
            reqMatch.innerHTML = '<i class="bi bi-x-circle"></i> Las contraseñas no coinciden';
        } else {
            reqMatch.className = 'req-item';
            reqMatch.innerHTML = '<i class="bi bi-circle"></i> Coinciden ambas contraseñas';
        }
    }

    newPassInput.addEventListener('input', validateRequirements);
    confirmPassInput.addEventListener('input', validateRequirements);

    // Manejar envío del formulario
    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;

        if (!newPass || newPass.length < 6) {
            showNotification(
                'Contraseña inválida',
                '<p>La contraseña debe tener al menos 6 caracteres.</p>',
                'warning'
            );
            return;
        }

        if (newPass !== confirmPass) {
            showNotification(
                'No coinciden',
                '<p>Las contraseñas no coinciden. Por favor, verifica.</p>',
                'warning'
            );
            return;
        }

        showLoading();

        const formData = new FormData();
        formData.append('new_password', newPass);

        try {
            const response = await fetch('/auth/change-password', {
                method: 'POST',
                body: formData
            });

            hideLoading();

            if (!response.ok) {
                let errorMsg = 'Error al cambiar la contraseña.';
                try {
                    const error = await response.json();
                    errorMsg = error.detail || errorMsg;
                } catch (e) {}
                showNotification('Error', `<p>${errorMsg}</p>`, 'error');
                return;
            }

            showNotification(
                'Contraseña Actualizada',
                '<p>Tu contraseña se cambió correctamente.</p><p class="text-muted small mt-2">Serás redirigido al inicio...</p>',
                'success'
            );

            setTimeout(() => {
                window.location.href = '/';
            }, 1500);

        } catch (error) {
            hideLoading();
            showNotification('Error', `<p>${error.message || 'Error de conexión'}</p>`, 'error');
        }
    });

    // Inicializar validación
    validateRequirements();
</script>
</body>
</html>
