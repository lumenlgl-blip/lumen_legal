<!DOCTYPE html>
<html>
<head>
    <title>Cambiar Contraseña - Lumen Legal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-password {
            max-width: 450px;
            width: 100%;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            background: white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card-password">
        <h2 class="text-center text-warning mb-3">🔑 Cambio de Contraseña</h2>
        <p class="text-center text-muted">Es tu primer acceso. Debes cambiar tu contraseña temporal.</p>
        
        <form id="changePasswordForm">
            <div class="mb-3">
                <label class="form-label"><strong>Nueva Contraseña *</strong></label>
                <input type="password" id="newPassword" class="form-control form-control-lg" placeholder="Mínimo 6 caracteres" required autocomplete="off">
            </div>
            <div class="mb-3">
                <label class="form-label"><strong>Confirmar Contraseña *</strong></label>
                <input type="password" id="confirmPassword" class="form-control form-control-lg" placeholder="Repite la contraseña" required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-warning btn-lg w-100">💾 Guardar Nueva Contraseña</button>
        </form>
    </div>
</div>

<!-- Modal de notificaciones -->
<div class="modal fade" id="notificationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" id="notificationHeader">
                <h5 class="modal-title" id="notificationTitle">Notificación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="notificationBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function showNotification(title, bodyHTML, type = 'info') {
    const modal = new bootstrap.Modal(document.getElementById('notificationModal'));
    const header = document.getElementById('notificationHeader');
    const titleEl = document.getElementById('notificationTitle');
    const bodyEl = document.getElementById('notificationBody');
    header.className = 'modal-header';
    if (type === 'success') { header.classList.add('bg-success', 'text-white'); titleEl.textContent = '✅ ' + title; }
    else if (type === 'error') { header.classList.add('bg-danger', 'text-white'); titleEl.textContent = '❌ ' + title; }
    else if (type === 'warning') { header.classList.add('bg-warning', 'text-dark'); titleEl.textContent = '⚠️ ' + title; }
    else { header.classList.add('bg-primary', 'text-white'); titleEl.textContent = 'ℹ️ ' + title; }
    bodyEl.innerHTML = bodyHTML;
    modal.show();
}

document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    
    if (!newPass || newPass.length < 6) {
        showNotification('Contraseña inválida', '<p>La contraseña debe tener al menos 6 caracteres.</p>', 'warning');
        return;
    }
    
    if (newPass !== confirmPass) {
        showNotification('No coinciden', '<p>Las contraseñas no coinciden.</p>', 'warning');
        return;
    }
    
    const formData = new FormData();
    formData.append('new_password', newPass);
    
    try {
        const response = await fetch('/auth/change-password', {
            method: 'POST',
            body: formData
        });
        
        if (!response.ok) {
            const error = await response.json();
            showNotification('Error', `<p>${error.detail || 'Error al cambiar'}</p>`, 'error');
            return;
        }
        
        showNotification('Contraseña Actualizada', '<p>Tu contraseña se cambió correctamente.</p>', 'success');
        
        setTimeout(() => window.location.href = '/', 1500);
        
    } catch (error) {
        showNotification('Error', `<p>${error.message}</p>`, 'error');
    }
});
</script>
</body>
</html>
